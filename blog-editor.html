<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Writer – DennisZeroVT</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body { background: #0a0a0f; color: #f5f5f5; font-family: Inter, system-ui; }
  .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(165,150,218,0.15); }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold">Blog <span class="text-[#A596DA]">Writer</span></h1>
    <a href="./" class="text-sm text-[#A596DA] hover:underline"><i class="fas fa-arrow-left mr-2"></i>Back to site</a>
  </div>

  <div class="grid lg:grid-cols-2 gap-6">
    <div class="glass rounded-2xl p-6">
      <h2 class="font-semibold mb-4">New Post</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs text-[#d6ccf7] uppercase">Title</label>
          <input id="title" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-[#A596DA] outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-[#d6ccf7] uppercase">Category</label>
            <select id="category" onchange="updateSubcats()" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10">
              <option>Game Dev</option>
              <option>Music Production</option>
              <option>Daily Life</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-[#d6ccf7] uppercase">Subcategory</label>
            <select id="subcategory" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-[#d6ccf7] uppercase">Date</label>
            <input id="date" type="date" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10">
          </div>
          <div>
            <label class="text-xs text-[#d6ccf7] uppercase">Color</label>
            <input id="color" type="color" value="#A596DA" class="w-full mt-1 h-[38px] px-1 py-1 rounded-lg bg-black/30 border border-white/10">
          </div>
        </div>
                        <div>
          <label class="text-xs text-[#d6ccf7] uppercase">Images (multiple)</label>
          <div class="mt-1 flex gap-2">
            <input id="imageUrl" placeholder="Paste image URL and press Add" class="flex-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10 text-sm">
            <button onclick="addImageUrl()" class="px-3 py-2 rounded-lg glass text-sm">Add URL</button>
            <label class="px-3 py-2 rounded-lg glass cursor-pointer text-sm hover:bg-white/10">
              <i class="fas fa-upload mr-1"></i> Upload
              <input type="file" id="imageFile" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)">
            </label>
          </div>
          <div id="imageGrid" class="mt-3 grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
          <p class="text-[10px] text-[#d6ccf7]/70 mt-1">Upload multiple files or paste URLs. They'll be embedded in the post. Keep total under 3MB for fast loading.</p>
        </div>
        <div>
          <label class="text-xs text-[#d6ccf7] uppercase">Content</label>
          <textarea id="body" rows="8" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-[#A596DA] outline-none"></textarea>
        </div>
        <div class="flex gap-2">
          <button onclick="addPost()" class="px-4 py-2 rounded-lg bg-[#A596DA] text-black font-semibold hover:bg-[#8B78CB]"><i class="fas fa-plus mr-2"></i>Add Post</button>
          <button onclick="clearForm()" class="px-4 py-2 rounded-lg glass">Clear</button>
        </div>
      </div>
    </div>

    <div class="glass rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold">Posts (<span id="count">0</span>)</h2>
        <div class="flex gap-2">
          <button onclick="loadFromSite()" class="text-xs px-3 py-1 rounded glass hover:bg-white/10">Load posts.json</button>
          <button onclick="exportJSON()" class="text-xs px-3 py-1 rounded bg-[#A596DA]/20 text-[#A596DA]">Export</button>
        </div>
      </div>
      <div id="posts-list" class="space-y-2 max-h-[340px] overflow-y-auto mb-4"></div>
      <textarea id="output" rows="10" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/50 border border-white/10 font-mono text-xs" readonly></textarea>
      <button onclick="copyOutput()" class="mt-2 w-full py-2 rounded-lg bg-white/10 hover:bg-white/20 text-sm"><i class="fas fa-copy mr-2"></i>Copy JSON</button>
    </div>
  </div>
</div>

<script>
let posts = [];
let currentImages = [];
const subcats = {
  'Game Dev': ['Snowfall', 'Stuck In Time', 'Other Projects'],
  'Music Production': ['Snowfall', 'Originals', 'Remixes', 'Soundtracks', 'Behind the Beat'],
  'Daily Life': ['Workflow', 'Thoughts', 'Updates', 'Gear']
};


let currentImages = [];

function handleImageUpload(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    if (file.size > 1.5 * 1024 * 1024) { alert(file.name + ' too large (>1.5MB)'); return; }
    const reader = new FileReader();
    reader.onload = function(ev) {
      currentImages.push(ev.target.result);
      renderImages();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function addImageUrl() {
  const url = document.getElementById('imageUrl').value.trim();
  if (!url) return;
  currentImages.push(url);
  document.getElementById('imageUrl').value = '';
  renderImages();
}

function renderImages() {
  const grid = document.getElementById('imageGrid');
  grid.innerHTML = currentImages.map((img,i) => `
    <div class="relative group">
      <img src="${img}" class="w-full h-20 object-cover rounded border border-white/10">
      <button onclick="removeImage(${i})" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-[10px] opacity-0 group-hover:opacity-100">×</button>
    </div>
  `).join('');
}

function removeImage(i) { currentImages.splice(i,1); renderImages(); }
function clearImages() { currentImages = []; renderImages(); }

function updateSubcats() {
  const cat = document.getElementById('category').value;
  const sel = document.getElementById('subcategory');
  sel.innerHTML = subcats[cat].map(s => `<option>${s}</option>`).join('');
  // Set color based on category
  const colors = {'Game Dev':'#A596DA','Music Production':'#ec4899','Daily Life':'#22c55e'};
  document.getElementById('color').value = colors[cat];
}

document.getElementById('date').valueAsDate = new Date();
updateSubcats();

function addPost() {
  const title = document.getElementById('title').value.trim();
  const category = document.getElementById('category').value;
  const subcategory = document.getElementById('subcategory').value;
  const date = document.getElementById('date').value;
  const body = document.getElementById('body').value.trim();
  const color = document.getElementById('color').value;
  
  
  if (!title || !body) { alert('Need title and content'); return; }
  
  const displayDate = new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  
  posts.unshift({ id, title, date, displayDate, category, subcategory, game: subcategory, color, body, images: [...currentImages] });
  render();
  clearForm();
}

function render() {
  document.getElementById('posts-list').innerHTML = posts.map((p,i) => `
    <div class="p-2.5 rounded-lg bg-black/30 border border-white/5 flex justify-between">
      <div>
        <div class="text-sm font-medium">${p.title}</div>
        <div class="text-[11px] text-[#d6ccf7]">${p.category} › ${p.subcategory} • ${p.displayDate}</div>
      </div>
      <button onclick="posts.splice(${i},1);render()" class="text-red-400 ml-2"><i class="fas fa-trash text-xs"></i></button>
    </div>
  `).join('');
  document.getElementById('count').textContent = posts.length;
  document.getElementById('output').value = JSON.stringify(posts, null, 2);
}



let currentImages = [];

function handleImageUpload(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    if (file.size > 1.5 * 1024 * 1024) { alert(file.name + ' too large (>1.5MB)'); return; }
    const reader = new FileReader();
    reader.onload = function(ev) {
      currentImages.push(ev.target.result);
      renderImages();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function addImageUrl() {
  const url = document.getElementById('imageUrl').value.trim();
  if (!url) return;
  currentImages.push(url);
  document.getElementById('imageUrl').value = '';
  renderImages();
}

function renderImages() {
  const grid = document.getElementById('imageGrid');
  grid.innerHTML = currentImages.map((img,i) => `
    <div class="relative group">
      <img src="${img}" class="w-full h-20 object-cover rounded border border-white/10">
      <button onclick="removeImage(${i})" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-[10px] opacity-0 group-hover:opacity-100">×</button>
    </div>
  `).join('');
}

function removeImage(i) { currentImages.splice(i,1); renderImages(); }
function clearImages() { currentImages = []; renderImages(); }

function handleImageUpload_OLD(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { alert('Image too large (>2MB). Compress or use URL instead.'); return; }
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('image').value = ev.target.result;
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('imagePreview').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}
function clearImages() {
  document.getElementById('image').value = '';
  document.getElementById('imagePreview').classList.add('hidden');
  document.getElementById('imageFile').value = '';
}

// Update preview when URL changes


function clearForm(){ document.getElementById('title').value=''; document.getElementById('body').value=''; clearImages(); }
function copyOutput(){ navigator.clipboard.writeText(document.getElementById('output').value); alert('Copied!'); }
function exportJSON(){ render(); }

async function loadFromSite(){
  try {
    const res = await fetch('./posts.json');
    posts = await res.json();
    render();
  } catch(e){ alert('No posts.json found'); }
}
loadFromSite();
</script>
</body>
</html>
