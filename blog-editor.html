<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog Editor - Blocks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#0a0a0f;color:#eee;font-family:Inter,system-ui} .glass{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px)}
</style>
</head>
<body class="p-6">
<div class="max-w-6xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">Blog Editor <span class="text-violet-400">BLOCKS</span></h1>
  
  <div class="grid lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-4">
      <div class="glass rounded-xl p-4">
        <input id="title" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 mb-3" placeholder="Title">
        <div class="grid grid-cols-3 gap-2">
          <select id="cat" class="bg-black/30 border border-white/10 rounded-lg px-2 py-1.5 text-sm"></select>
          <select id="sub" class="bg-black/30 border border-white/10 rounded-lg px-2 py-1.5 text-sm"></select>
          <input id="date" type="date" class="bg-black/30 border border-white/10 rounded-lg px-2 py-1.5 text-sm">
        </div>
      </div>
      
      <div class="glass rounded-xl p-4">
        <div class="flex justify-between mb-3">
          <span class="text-sm">Blocks</span>
          <div class="flex gap-2">
            <button id="addT" class="px-2 py-1 bg-white/10 rounded text-xs">+ Text</button>
            <button id="addI" class="px-2 py-1 bg-white/10 rounded text-xs">+ Image</button>
            <button id="addD" class="px-2 py-1 bg-white/10 rounded text-xs">+ Divider</button>
          </div>
        </div>
        <div id="list" class="space-y-3"></div>
      </div>
      
      <button id="pub" class="w-full py-3 bg-violet-500 text-black font-bold rounded-xl">Publish</button>
    </div>
    
    <div class="space-y-4">
      <div class="glass rounded-xl p-4">
        <h3 class="text-sm mb-2">Live Posts (<span id="count">0</span>)</h3>
        <div id="posts" class="space-y-1 text-xs max-h-80 overflow-auto"></div>
      </div>
      <div class="glass rounded-xl p-4">
        <h3 class="text-sm mb-2">Categories</h3>
        <div id="cats" class="space-y-1 text-xs"></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="f" accept="image/*" hidden>

<script type="module">
const PASS='dennis2026';
if(localStorage.p!==PASS){ if(prompt('pass')!==PASS) throw 'no'; localStorage.p=PASS; }

import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,addDoc,onSnapshot,doc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app=initializeApp({apiKey:"AIzaSyANgUuiKzFOlFv3gesXvu9VQ36-aS7vhjs",authDomain:"denniszerovt-blog.firebaseapp.com",projectId:"denniszerovt-blog"});
const db=getFirestore(app);

let cats=[]; let blocks=[];
date.valueAsDate=new Date();

onSnapshot(collection(db,'categories'),s=>{
  cats=s.docs.map(d=>d.data());
  cat.innerHTML=cats.map(c=>`<option>${c.name}</option>`).join('');
  sub.innerHTML=(cats[0]?.subs||[]).map(x=>`<option>${x}</option>`).join('');
  catsEl.innerHTML=cats.map(c=>`<div>${c.name}</div>`).join('');
});
const catsEl = document.getElementById('cats');
cat.onchange=()=>{ const c=cats.find(x=>x.name===cat.value); sub.innerHTML=(c?.subs||[]).map(x=>`<option>${x}</option>`).join(''); };

onSnapshot(collection(db,'posts'),s=>{
  const p=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  count.textContent=p.length;
  posts.innerHTML=p.map(x=>`<div class="flex justify-between items-center p-1.5 bg-black/20 rounded"><span class="truncate">${x.title}</span><button onclick="delP('${x.id}')" class="text-red-400 ml-2">del</button></div>`).join('');
});
window.delP=async id=>{ if(confirm('Delete post?')) await deleteDoc(doc(db,'posts',id)); };

function draw(){
  list.innerHTML = blocks.map((b,i)=>`
    <div class="bg-black/20 p-2 rounded border border-white/10">
      <div class="flex justify-between text-[10px] mb-1 opacity-60">
        <span>${b.type.toUpperCase()}</span>
        <span><button onclick="up(${i})">↑</button> <button onclick="down(${i})">↓</button> <button onclick="del(${i})">✕</button></span>
      </div>
      ${b.type==='text'?`<textarea oninput="blocks[${i}].value=this.value" class="w-full h-20 bg-black/30 border border-white/10 rounded p-1 text-sm">${b.value||''}</textarea>`:
        b.type==='image'?`<input oninput="blocks[${i}].value=this.value" value="${b.value||''}" placeholder="image url" class="w-full bg-black/30 border border-white/10 rounded p-1 text-xs mb-1"><button onclick="pick(${i})" class="text-[10px] underline">upload</button>${b.value?`<img src="${b.value}" class="mt-1 max-h-32">`:''}`:
        `<hr class="border-white/20">`}
    </div>`).join('') || '<div class="text-center opacity-40 py-8 text-sm">empty</div>';
}
window.up=i=>{if(i>0){[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];draw()}};
window.down=i=>{if(i<blocks.length-1){[blocks[i+1],blocks[i]]=[blocks[i+1],blocks[i]];draw()}};
window.del=i=>{blocks.splice(i,1);draw()};
window.pick=i=>{f.dataset.i=i;f.click()};
f.onchange=e=>{const r=new FileReader();r.onload=()=>{blocks[+f.dataset.i].value=r.result;draw()};r.readAsDataURL(f.files[0])};

addT.onclick=()=>{blocks.push({type:'text',value:''});draw()};
addI.onclick=()=>{blocks.push({type:'image',value:''});draw()};
addD.onclick=()=>{blocks.push({type:'divider'});draw()};
draw();

pub.onclick=async()=>{
  if(!title.value) return alert('title');
  await addDoc(collection(db,'posts'),{
    title:title.value,
    category:cat.value,
    subcategory:sub.value,
    date:date.value,
    displayDate:new Date().toLocaleDateString(),
    blocks,
    body:blocks.filter(b=>b.type==='text').map(b=>b.value).join('\n\n'),
    images:blocks.filter(b=>b.type==='image').map(b=>b.value),
    createdAt:serverTimestamp()
  });
  title.value='';blocks=[];draw();alert('published');
};
</script>
</body>
</html>
