<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Writer – DennisZeroVT</title>
<script src="https://cdn.tailwindcss.com">
async function publishToGitHub() {
  const user = document.getElementById('ghUser').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const token = document.getElementById('ghToken').value.trim();
  const btn = document.getElementById('ghBtn');
  
  if (!user || !repo || !token) { alert('Fill username, repo, and token'); return; }
  
  // Save for next time
  localStorage.setItem('ghUser', user);
  localStorage.setItem('ghRepo', repo);
  localStorage.setItem('ghToken', token);
  
  btn.disabled = true; btn.textContent = 'Publishing...';
  
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2))));
  const url = `https://api.github.com/repos/${user}/${repo}/contents/posts.json`;
  
  try {
    // Get current SHA
    let sha = null;
    const getRes = await fetch(url, { headers: { Authorization: `token ${token}` } });
    if (getRes.ok) {
      const data = await getRes.json();
      sha = data.sha;
    }
    
    const res = await fetch(url, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Update blog: ${posts[0]?.title || 'new post'}`,
        content: content,
        sha: sha,
        branch: 'main'
      })
    });
    
    if (res.ok) {
      btn.textContent = '✓ Published!';
      setTimeout(()=>{ btn.textContent='Publish to GitHub'; btn.disabled=false; }, 3000);
      alert('Published! GitHub Pages will update in ~30-60 seconds.');
    } else {
      const err = await res.json();
      throw new Error(err.message);
    }
  } catch(e) {
    alert('Error: ' + e.message);
    btn.textContent = 'Publish to GitHub'; btn.disabled=false;
  }
}

// Load saved settings
window.addEventListener('load', () => {
  document.getElementById('ghUser').value = localStorage.getItem('ghUser') || '';
  document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || 'denniszerovt.github.io';
  document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
});

</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body { background: #0a0a0f; color: #f5f5f5; font-family: Inter, system-ui; }
  .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(165,150,218,0.15); }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold">Blog <span class="text-[#A596DA]">Writer</span></h1>
    <a href="./" class="text-sm text-[#A596DA] hover:underline"><i class="fas fa-arrow-left mr-2"></i>Back to site</a>
  </div>

  <div class="grid lg:grid-cols-2 gap-6">
    <div class="glass rounded-2xl p-6">
      <h2 class="font-semibold mb-4">New Post</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs text-[#d6ccf7] uppercase">Title</label>
          <input id="title" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-[#A596DA] outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-[#d6ccf7] uppercase">Category</label>
            <select id="category" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10">
              <option>Game Dev</option>
              <option>Music Production</option>
              <option>Daily Life</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-[#d6ccf7] uppercase">Subcategory</label>
            <select id="subcategory" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-[#d6ccf7] uppercase">Date</label>
            <input id="date" type="date" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10">
          </div>
          <div>
            <label class="text-xs text-[#d6ccf7] uppercase">Color</label>
            <input id="color" type="color" value="#A596DA" class="w-full mt-1 h-[38px] px-1 py-1 rounded-lg bg-black/30 border border-white/10">
          </div>
        </div>
        <div>
          <label class="text-xs text-[#d6ccf7] uppercase">Images (multiple)</label>
          <div class="mt-1 flex gap-2">
            <input id="imageUrl" placeholder="Paste URL then Add" class="flex-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10 text-sm">
            <button type="button" onclick="addImageUrl()" class="px-3 py-2 rounded-lg glass text-sm">Add</button>
            <label class="px-3 py-2 rounded-lg glass cursor-pointer text-sm hover:bg-white/10">
              <i class="fas fa-upload mr-1"></i> Upload
              <input type="file" id="imageFile" accept="image/*" multiple class="hidden">
            </label>
          </div>
          <div id="imageGrid" class="mt-3 grid grid-cols-4 gap-2"></div>
        </div>
        <div>
          <label class="text-xs text-[#d6ccf7] uppercase">Content</label>
          <textarea id="body" rows="8" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/30 border border-white/10 focus:border-[#A596DA] outline-none"></textarea>
        </div>
        <div class="flex gap-2">
          <button onclick="addPost()" class="px-4 py-2 rounded-lg bg-[#A596DA] text-black font-semibold hover:bg-[#8B78CB]"><i class="fas fa-plus mr-2"></i>Add Post</button>
          <button onclick="clearForm()" class="px-4 py-2 rounded-lg glass">Clear</button>
        </div>
      </div>
    </div>

    <div class="glass rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold">Posts (<span id="count">0</span>)</h2>
        <div class="flex gap-2">
          <button onclick="loadPosts()" class="text-xs px-3 py-1 rounded glass hover:bg-white/10">Load posts.json</button>
          <button onclick="downloadJSON()" class="text-xs px-3 py-1 rounded bg-[#A596DA]/20 text-[#A596DA]">Download</button>
        </div>
      </div>
      <div id="posts-list" class="space-y-2 max-h-[340px] overflow-y-auto mb-4"></div>
      <textarea id="output" rows="10" class="w-full mt-1 px-3 py-2 rounded-lg bg-black/50 border border-white/10 font-mono text-xs" readonly></textarea>
      <button onclick="copyOutput()" class="mt-2 w-full py-2 rounded-lg bg-white/10 hover:bg-white/20 text-sm"><i class="fas fa-copy mr-2"></i>Copy JSON</button>
      <div class="flex gap-2 mt-4 p-3 rounded-lg bg-[#A596DA]/10 border border-[#A596DA]/20">
        <div class="flex-1">
          <div class="text-xs font-semibold mb-1">GitHub Auto-Publish</div>
          <div class="grid grid-cols-3 gap-2 text-xs">
            <input id="ghUser" placeholder="username" class="px-2 py-1 rounded bg-black/30 border border-white/10">
            <input id="ghRepo" placeholder="repo" class="px-2 py-1 rounded bg-black/30 border border-white/10">
            <input id="ghToken" type="password" placeholder="token" class="px-2 py-1 rounded bg-black/30 border border-white/10">
          </div>
        </div>
        <button onclick="publishToGitHub()" id="ghBtn" class="px-4 py-2 rounded-lg bg-green-600 text-white text-sm font-semibold hover:bg-green-700 self-end">Publish to GitHub</button>
      </div>

    </div>
  </div>
</div>

<script>
let posts = [];
let currentImages = [];

const subcats = {
  'Game Dev': ['Snowfall', 'Stuck In Time', 'Other Projects'],
  'Music Production': ['Snowfall', 'Originals', 'Remixes', 'Soundtracks', 'Behind the Beat'],
  'Daily Life': ['Workflow', 'Thoughts', 'Updates', 'Gear']
};

function init() {
  document.getElementById('category').addEventListener('change', updateSubcats);
  document.getElementById('imageFile').addEventListener('change', handleImageUpload);
  document.getElementById('date').valueAsDate = new Date();
  updateSubcats();
  loadPosts();
}

function updateSubcats() {
  const cat = document.getElementById('category').value;
  const sel = document.getElementById('subcategory');
  sel.innerHTML = subcats[cat].map(s => `<option>${s}</option>`).join('');
  const colors = {'Game Dev':'#A596DA','Music Production':'#ec4899','Daily Life':'#22c55e'};
  document.getElementById('color').value = colors[cat];
}

function handleImageUpload(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    if (file.size > 1500000) { alert(file.name + ' >1.5MB, compress it'); return; }
    const reader = new FileReader();
    reader.onload = ev => { currentImages.push(ev.target.result); renderImages(); };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function addImageUrl() {
  const url = document.getElementById('imageUrl').value.trim();
  if (!url) return;
  currentImages.push(url);
  document.getElementById('imageUrl').value = '';
  renderImages();
}

function renderImages() {
  const grid = document.getElementById('imageGrid');
  grid.innerHTML = currentImages.map((img,i) => `
    <div class="relative group">
      <img src="${img}" class="w-full h-16 object-cover rounded border border-white/10">
      <button onclick="currentImages.splice(${i},1); renderImages()" class="absolute -top1 -right-1 w-5 h-5 bg-red-600 rounded-full text-xs opacity-0 group-hover:opacity-100">×</button>
    </div>
  `).join('');
}

function addPost() {
  const title = document.getElementById('title').value.trim();
  const category = document.getElementById('category').value;
  const subcategory = document.getElementById('subcategory').value;
  const date = document.getElementById('date').value;
  const body = document.getElementById('body').value.trim();
  const color = document.getElementById('color').value;
  
  if (!title || !body || !date) { alert('Title, date and content required'); return; }
  
  const displayDate = new Date(date+'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const id = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  
  posts.unshift({ id, title, date, displayDate, category, subcategory, game: subcategory, color, body, images: [...currentImages] });
  renderPosts();
  clearForm();
}

function renderPosts() {
  document.getElementById('posts-list').innerHTML = posts.map((p,i) => `
    <div class="p-2.5 rounded-lg bg-black/30 border border-white/5 flex justify-between items-start">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium truncate">${p.title}</div>
        <div class="text-[11px] text-[#d6ccf7]">${p.category} › ${p.subcategory} • ${p.displayDate} ${p.images?.length ? '• '+p.images.length+' img' : ''}</div>
      </div>
      <button onclick="posts.splice(${i},1); renderPosts()" class="text-red-400 ml-2 shrink-0"><i class="fas fa-trash text-xs"></i></button>
    </div>
  `).join('');
  document.getElementById('count').textContent = posts.length;
  document.getElementById('output').value = JSON.stringify(posts, null, 2);
}

function clearForm() {
  document.getElementById('title').value = '';
  document.getElementById('body').value = '';
  currentImages = [];
  renderImages();
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('output').value);
  alert('Copied! Paste into posts.json on GitHub');
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(posts, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'posts.json';
  a.click();
}

async function loadPosts() {
  try {
    const res = await fetch('./posts.json?'+Date.now());
    if (!res.ok) throw new Error('not found');
    posts = await res.json();
    renderPosts();
  } catch(e) {
    console.log('No posts.json yet, starting fresh');
    posts = [];
    renderPosts();
  }
}

window.addEventListener('DOMContentLoaded', init);

// Load saved settings
window.addEventListener('load', () => {
  document.getElementById('ghUser').value = localStorage.getItem('ghUser') || '';
  document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || 'denniszerovt.github.io';

</script>
</body>
</html>
