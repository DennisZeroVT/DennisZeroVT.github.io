<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog Editor Pro - Blocks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body{background:#0a0a0f;color:#f5f5f5;font-family:Inter} h1{font-family:'Space Grotesk'}
.glass{background:rgba(255,255,255,.05);backdrop-filter:blur(16px);border:1px solid rgba(165,150,218,.15)}
.gradient{background:linear-gradient(135deg,#A596DA,#c4b5fd)}
.block-card{transition:all .2s}
.block-card:hover{border-color:rgba(165,150,218,.4)}
.drag-handle{cursor:grab}
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold">Blog <span class="text-[#A596DA]">Editor</span> <span class="ml-2 text-xs px-2 py-1 rounded-full gradient text-black">BLOCKS</span></h1>
    <div class="flex gap-2 items-center"><a href="./" class="px-3 py-2 glass rounded-lg text-sm hover:bg-white/10"><i class="fas fa-eye mr-1"></i>View</a><input id="ghToken" placeholder="GitHub token (optional)" class="px-3 py-2 rounded-lg bg-black/40 border border-white/10 text-xs w-40 md:w-56" title="Paste Personal Access Token for auto-upload to GitHub"><button id="lockBtn" class="px-3 py-2 glass rounded-lg text-sm"><i class="fas fa-lock"></i></button></div>
  </div>

  <div class="grid xl:grid-cols-3 gap-6">
    <div class="xl:col-span-2 glass rounded-2xl p-6">
      <h2 class="font-semibold mb-4 flex items-center gap-2"><i class="fas fa-cubes text-[#A596DA]"></i> Create Block Post</h2>
      <div class="space-y-4">
        <input id="title" placeholder="Post title..." class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 focus:border-[#A596DA]/50 outline-none text-lg">
        <div class="grid md:grid-cols-3 gap-3">
          <select id="category" class="px-3 py-2.5 rounded-xl bg-black/40 border border-white/10"></select>
          <select id="subcategory" class="px-3 py-2.5 rounded-xl bg-black/40 border border-white/10"></select>
          <input id="date" type="date" class="px-3 py-2.5 rounded-xl bg-black/40 border border-white/10">
        </div>
        <div class="flex items-center gap-3">
          <label class="text-sm opacity-70">Post Color:</label>
          <input id="color" type="color" value="#A596DA" class="w-12 h-9 rounded-lg bg-black/40 border border-white/10 cursor-pointer">
          <span class="text-xs opacity-50">Overrides category color</span>
        </div>

        <!-- BLOCK BUILDER -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <label class="text-sm font-medium opacity-80">Content Blocks</label>
            <div class="flex gap-2">
              <button data-add="image" class="add-btn px-3 py-1.5 glass rounded-lg text-xs hover:bg-white/10"><i class="fas fa-image mr-1 text-[#A596DA]"></i>Image</button>
              <button data-add="text" class="add-btn px-3 py-1.5 glass rounded-lg text-xs hover:bg-white/10"><i class="fas fa-align-left mr-1 text-[#A596DA]"></i>Text</button>
              <button data-add="divider" class="add-btn px-3 py-1.5 glass rounded-lg text-xs hover:bg-white/10"><i class="fas fa-minus mr-1 text-[#A596DA]"></i>Divider</button>
            </div>
          </div>
          <div id="blocks" class="space-y-3 min-h-[200px] p-3 rounded-xl bg-black/20 border border-white/5"></div>
          <div class="mt-2 flex gap-2">
            <label class="px-3 py-1.5 glass rounded-lg text-xs cursor-pointer hover:bg-white/10"><i class="fas fa-upload mr-1"></i>Upload Images<input type="file" id="files" multiple accept="image/*" class="hidden"></label>
            <span class="text-[11px] opacity-50 self-center">Tip: drag blocks to reorder • matches your screenshot layout</span>
          </div>
        </div>

        <button id="publish" class="w-full py-3.5 rounded-xl gradient text-black font-bold text-lg hover:opacity-90 transition"><i class="fas fa-bolt mr-2"></i>Publish Live</button>
      </div>
    </div>

    <div class="space-y-6">
      <div class="glass rounded-2xl p-5">
        <h3 class="font-semibold mb-3 flex items-center justify-between">Categories <span id="catCount" class="text-xs opacity-60">0</span></h3>
        <div id="catList" class="space-y-2 mb-3 max-h-60 overflow-auto"></div>
        <div class="flex gap-2">
          <input id="newCat" placeholder="New category" class="flex-1 px-2 py-1.5 rounded bg-black/30 border border-white/10 text-sm">
          <input id="newColor" type="color" value="#A596DA" class="w-8 h-8 rounded bg-black/30">
          <button id="addCatBtn" class="px-3 py-1.5 glass rounded text-xs">Add</button>
        </div>
        <input id="newSubs" placeholder="Subcategories (comma separated)" class="w-full mt-2 px-2 py-1.5 rounded bg-black/30 border border-white/10 text-xs">
      </div>

      <div class="glass rounded-2xl p-5">
        <h3 class="font-semibold mb-3">Live Posts (<span id="postCount">0</span>)</h3>
        <div id="postList" class="space-y-2 max-h-80 overflow-auto"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
// PASSWORD DISABLED FOR TESTING - was "dennis2026"
localStorage.setItem('editorPass','dennis2026');
document.getElementById('lockBtn').onclick=()=>{alert('Lock disabled in this build')};

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, setDoc, serverTimestamp, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const cfg = {
  apiKey: "AIzaSyANgUuiKzFOlFv3gesXvu9VQ36-aS7vhjs",
  authDomain: "denniszerovt-blog.firebaseapp.com",
  projectId: "denniszerovt-blog",
  storageBucket: "denniszerovt-blog.firebasestorage.app",
  messagingSenderId: "438217423363",
  appId: "1:438217423363:web:5db4e6e955494f87e6c36"
};
const app = initializeApp(cfg);
const db = getFirestore(app);

let categories = [];
let blocks = [];

const defaults = [
  {id:'game-dev', name:'Game Dev', color:'#A596DA', subs:['Snowfall','Stuck In Time','Other Projects']},
  {id:'music-production', name:'Music Production', color:'#ec4899', subs:['Snowfall','Originals','Remixes','Soundtracks','Behind the Beat']},
  {id:'daily-life', name:'Daily Life', color:'#22c55e', subs:['Workflow','Thoughts','Updates','Gear']}
];

// ensure defaults
getDocs(collection(db,'categories')).then(snap=>{ if(snap.empty){ defaults.forEach(c=> setDoc(doc(db,'categories',c.id), c)); }});

onSnapshot(collection(db,'categories'), snap=>{
  categories = snap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('catCount').textContent = categories.length;
  const catSel = document.getElementById('category');
  catSel.innerHTML = categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  updateSubs();
  renderCats();
});

function updateSubs(){
  const cat = categories.find(c=>c.name===category.value);
  subcategory.innerHTML = (cat?.subs||[]).map(s=>`<option>${s}</option>`).join('');
  if(cat) color.value = cat.color;
}
category.onchange = updateSubs;
date.valueAsDate = new Date();

function renderCats(){
  const list = document.getElementById('catList');
  list.innerHTML = categories.map(c=>`
    <div class="p-2.5 rounded-lg bg-black/20 border border-white/5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full" style="background:${c.color}"></div><span class="text-sm">${c.name}</span></div>
        <div class="flex gap-2">
          <button data-edit="${c.id}" class="text-[#A596DA] text-xs hover:underline">Edit</button>
          <button data-del="${c.id}" class="text-red-400 text-xs hover:underline">Del</button>
        </div>
      </div>
      <div id="edit-${c.id}" class="hidden mt-2 space-y-1">
        <input id="n-${c.id}" value="${c.name}" class="w-full px-2 py-1 rounded bg-black/40 text-xs border border-white/10">
        <div class="flex gap-1">
          <input id="col-${c.id}" type="color" value="${c.color}" class="w-8 h-6">
          <input id="s-${c.id}" value="${c.subs.join(', ')}" class="flex-1 px-2 py-1 rounded bg-black/40 text-xs border border-white/10">
        </div>
        <div class="flex gap-1">
          <button data-save="${c.id}" class="flex-1 py-1 bg-[#A596DA]/20 text-[#A596DA] rounded text-xs">Save</button>
          <button data-cancel="${c.id}" class="px-2 py-1 bg-white/10 rounded text-xs">Cancel</button>
        </div>
      </div>
    </div>
  `).join('');
  
  list.querySelectorAll('[data-edit]').forEach(b=> b.onclick=()=> document.getElementById('edit-'+b.dataset.edit).classList.toggle('hidden'));
  list.querySelectorAll('[data-cancel]').forEach(b=> b.onclick=()=> document.getElementById('edit-'+b.dataset.cancel).classList.add('hidden'));
  list.querySelectorAll('[data-del]').forEach(b=> b.onclick=async()=>{ if(confirm('Delete category?')) await deleteDoc(doc(db,'categories',b.dataset.del)); });
  list.querySelectorAll('[data-save]').forEach(b=> b.onclick=async()=>{
    const id=b.dataset.save;
    const name=document.getElementById('n-'+id).value.trim();
    const col=document.getElementById('col-'+id).value;
    const subs=document.getElementById('s-'+id).value.split(',').map(x=>x.trim()).filter(Boolean);
    await setDoc(doc(db,'categories',id), {id,name,color:col,subs});
  });
}

document.getElementById('addCatBtn').onclick = async ()=>{
  const name = newCat.value.trim(); if(!name) return;
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const subs = newSubs.value.split(',').map(s=>s.trim()).filter(Boolean);
  await setDoc(doc(db,'categories',id), {id,name,color:newColor.value,subs});
  newCat.value=''; newSubs.value='';
};

// BLOCKS SYSTEM
function uid(){ return Math.random().toString(36).slice(2,9); }

function addBlock(type, data={}){
  const block = { id: uid(), type, ...data };
  if(type==='text') block.content = data.content || '';
  if(type==='image') block.src = data.src || '';
  if(type==='divider') {}
  blocks.push(block);
  renderBlocks();
}

function renderBlocks(){
  const wrap = document.getElementById('blocks');
  if(blocks.length===0){
    wrap.innerHTML = `<div class="text-center py-12 opacity-50 text-sm">No blocks yet — click Image, Text, or Divider above<br>to build like your screenshot</div>`;
    return;
  }
  wrap.innerHTML = blocks.map((b,i)=> {
    if(b.type==='text'){
      return `<div class="block-card p-3 rounded-xl bg-black/30 border border-white/10" draggable="true" data-i="${i}">
        <div class="flex items-center gap-2 mb-2">
          <i class="fas fa-grip-vertical drag-handle opacity-40"></i>
          <span class="text-xs font-medium text-[#A596DA]">TEXT BLOCK</span>
          <div class="ml-auto flex gap-1">
            <button data-up="${i}" class="w-6 h-6 rounded hover:bg-white/10 text-[11px]">↑</button>
            <button data-down="${i}" class="w-6 h-6 rounded hover:bg-white/10 text-[11px]">↓</button>
            <button data-del="${i}" class="w-6 h-6 rounded hover:bg-red-500/20 text-red-400 text-[11px]">×</button>
          </div>
        </div>
        <textarea data-txt="${i}" rows="3" placeholder="Write text like 'the drums i used are...'" class="w-full px-3 py-2 rounded-lg bg-black/40 border border-white/10 text-sm resize-y">${b.content||''}</textarea>
      </div>`;
    }
    if(b.type==='image'){
      return `<div class="block-card p-3 rounded-xl bg-black/30 border border-white/10" draggable="true" data-i="${i}">
        <div class="flex items-center gap-2 mb-2">
          <i class="fas fa-grip-vertical drag-handle opacity-40"></i>
          <span class="text-xs font-medium text-[#A596DA]">IMAGE BLOCK</span>
          <div class="ml-auto flex gap-1">
            <button data-up="${i}" class="w-6 h-6 rounded hover:bg-white/10 text-[11px]">↑</button>
            <button data-down="${i}" class="w-6 h-6 rounded hover:bg-white/10 text-[11px]">↓</button>
            <button data-del="${i}" class="w-6 h-6 rounded hover:bg-red-500/20 text-red-400 text-[11px]">×</button>
          </div>
        </div>
        ${b.src?`<img src="${b.src}" class="w-full max-h-60 object-contain rounded-lg mb-2 bg-black/50">`:''}
        <input data-img="${i}" placeholder="Paste image URL" value="${b.src||''}" class="w-full px-3 py-2 rounded-lg bg-black/40 border border-white/10 text-sm">
      </div>`;
    }
    if(b.type==='divider'){
      return `<div class="block-card p-3 rounded-xl bg-black/30 border border-white/10" draggable="true" data-i="${i}">
        <div class="flex items-center gap-2">
          <i class="fas fa-grip-vertical drag-handle opacity-40"></i>
          <span class="text-xs font-medium opacity-60">DIVIDER</span>
          <div class="flex-1 h-[3px] bg-white/20 mx-3 rounded"></div>
          <div class="flex gap-1">
            <button data-up="${i}" class="w-6 h-6 rounded hover:bg-white/10 text-[11px]">↑</button>
            <button data-down="${i}" class="w-6 h-6 rounded hover:bg-white/10 text-[11px]">↓</button>
            <button data-del="${i}" class="w-6 h-6 rounded hover:bg-red-500/20 text-red-400 text-[11px]">×</button>
          </div>
        </div>
      </div>`;
    }
  }).join('');

  // bind events
  wrap.querySelectorAll('[data-txt]').forEach(el=> el.oninput = e=> blocks[+el.dataset.txt].content = e.target.value );
  wrap.querySelectorAll('[data-img]').forEach(el=> el.oninput = e=> { blocks[+el.dataset.img].src = e.target.value; renderBlocks(); });
  wrap.querySelectorAll('[data-del]').forEach(b=> b.onclick=()=>{ blocks.splice(+b.dataset.del,1); renderBlocks(); });
  wrap.querySelectorAll('[data-up]').forEach(b=> b.onclick=()=>{ const i=+b.dataset.up; if(i>0){ [blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]]; renderBlocks(); }});
  wrap.querySelectorAll('[data-down]').forEach(b=> b.onclick=()=>{ const i=+b.dataset.down; if(i<blocks.length-1){ [blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]]; renderBlocks(); }});

  // drag
  let dragIdx=null;
  wrap.querySelectorAll('[draggable]').forEach(el=>{
    el.ondragstart = ()=> dragIdx = +el.dataset.i;
    el.ondragover = e=> e.preventDefault();
    el.ondrop = e=> { e.preventDefault(); const to=+el.dataset.i; const item=blocks.splice(dragIdx,1)[0]; blocks.splice(to,0,item); renderBlocks(); };
  });
}

document.querySelectorAll('.add-btn').forEach(b=> b.onclick=()=> addBlock(b.dataset.add));

// === FIXED IMAGE SYSTEM WITH COMPRESSION ===

// GitHub token field
const ghInput = document.getElementById('ghToken');
ghInput.value = localStorage.getItem('github_pat') || '';
ghInput.onchange = ()=>{ const v = ghInput.value.trim(); if(v) localStorage.setItem('github_pat', v); else localStorage.removeItem('github_pat'); };

const GITHUB_OWNER = 'denniszerovt';
const GITHUB_REPO = 'denniszerovt.github.io';
const GITHUB_PATH = 'images/posts';


async function deleteFromGitHub(url){
  const token = localStorage.getItem('github_pat');
  if(!token || !url.includes('denniszerovt.github.io/images/posts/')) return;
  try{
    const path = url.split('denniszerovt.github.io/')[1];
    // get sha
    const getRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`, {
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    });
    if(!getRes.ok) return;
    const data = await getRes.json();
    await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,{
      method:'DELETE',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'delete '+path.split('/').pop(), sha:data.sha, branch:'main'})
    });
  }catch(e){ console.error('delete failed', e); }
}

async function uploadToGitHub(file){
  const token = localStorage.getItem('github_pat');
  if(!token) return null;
  try{
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await img.decode();
    const scale = Math.min(1, 1280 / img.width);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width*scale);
    canvas.height = Math.round(img.height*scale);
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg',0.78);
    const b64 = dataUrl.split(',')[1];
    const filename = Date.now()+'_'+file.name.replace(/[^a-z0-9.]/gi,'_')+'.jpg';
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}/${filename}`,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'upload '+filename, content:b64, branch:'main'})
    });
    if(res.ok) return `https://${GITHUB_OWNER}.github.io/${GITHUB_PATH}/${filename}`;
    console.error('GitHub error', await res.text());
  }catch(e){ console.error('upload failed', e); }
  return null;
}

async function compressFile(file, maxW=1000, quality=0.55){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      // try webp first (30% smaller), fallback to jpeg
      canvas.toBlob(async (blob)=>{
        if(!blob){ resolve(null); return; }
        const reader = new FileReader();
        reader.onloadend = ()=> resolve({dataUrl: reader.result, size: blob.size});
        reader.readAsDataURL(blob);
      }, 'image/webp', quality);
    };
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById('files').onchange = async e=>{
  for(const f of [...e.target.files]){
    const note = document.createElement('div');
    note.className = 'text-xs opacity-60 px-2';
    note.textContent = 'Compressing '+f.name+'...';
    document.getElementById('blocks').prepend(note);
    const out = await compressFile(f);
    note.remove();
    if(out) addBlock('image',{src: out.dataUrl});
  }
  e.target.value='';
};

// upload images -> auto add image blocks
// old handler removed

// publish
document.getElementById('publish').onclick = async ()=>{
  const btn = document.getElementById('publish');
  if(blocks.length===0) return alert('Add at least one block');
  if(JSON.stringify(blocks).length > 950000){
    if(!confirm('Post is near 1MB limit. Make sure you used Upload (not paste). Continue?')) return;
  }
  const data = {
    title: title.value.trim(),
    category: category.value,
    subcategory: subcategory.value,
    date: date.value,
    displayDate: new Date(date.value+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    blocks: blocks,
    // backwards compat
    body: '',
    images: [],
    color: color.value,
    createdAt: serverTimestamp()
  };
  if(!data.title) return alert('Need title');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Publishing...';
  try{ await addDoc(collection(db,'posts'), data); }catch(e){ alert('Save failed: '+e.message+'\nUse Upload button to compress images.'); btn.disabled=false; btn.innerHTML='<i class="fas fa-bolt mr-2"></i>Publish Live'; return; }
  title.value=''; blocks=[]; renderBlocks();
  btn.disabled=false; btn.innerHTML='<i class="fas fa-bolt mr-2"></i>Publish Live';
};

// posts list
onSnapshot(collection(db,'posts'), snap=>{
  const posts = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  document.getElementById('postCount').textContent = posts.length;
  document.getElementById('postList').innerHTML = posts.map(p=>`
    <div class="p-2.5 rounded-lg bg-black/20 border border-white/5 flex justify-between items-start gap-2">
      <div class="flex-1 min-w-0">
        <div class="text-sm truncate">${p.title}</div>
        <div class="text-[11px] opacity-60">${p.category} • ${p.displayDate||p.date} • ${p.blocks? p.blocks.length+' blocks':'legacy'}</div>
      </div>
      <button data-delp="${p.id}" class="text-red-400 hover:text-red-300 p-1"><i class="fas fa-trash text-xs"></i></button>
    </div>
  `).join('');
  document.querySelectorAll('[data-delp]').forEach(b=> b.onclick=async()=>{ if(confirm('Delete post?')) await deleteDoc(doc(db,'posts',b.dataset.delp)); });
});

// init with example from screenshot
renderBlocks();
addBlock('image',{src:''});
addBlock('text',{content:'thje drums i used are addticve drums with a compressopr\n\ni also dialed up the overhead to max'});
addBlock('divider',{});
addBlock('image',{src:''});
addBlock('text',{content:'for the loud string is used the swam collection bc i have good control over them vibration and erxpression wise'});
</script>
