<script id="patch-overlay-credits">
// ── inside window.openPersonOverlay = function(personId) { ... } ──

const rawCredits  = person.credits || [];
const rawProjects = person.projects || [];   // legacy fallback
let projectsHTML  = '';

if (rawCredits.length > 0) {
  // ── NEW: rich credits with per-song role ──
  const creditButtons = rawCredits.map(cr => {
    const roleLabel = cr.role  || 'Collaborator';
    const songLabel = cr.song  || '';
    const noteLabel = cr.note  || '';

    // Find matching song object for click-through
    let song = null;
    const songSources = [window.songData, window.songs, window.FALLBACK_SONGS];
    for (const source of songSources) {
      if (!source) continue;
      const arr = Array.isArray(source) ? source : Object.values(source);
      song = arr.find(s => s && (
        (cr.songId && s.id === cr.songId) ||
        (s.title && s.title.toLowerCase() === songLabel.toLowerCase())
      ));
      if (song) break;
    }

    const noteHTML = noteLabel
      ? `<span style="display:block;font-size:0.75em;opacity:0.6;margin-top:2px;">${noteLabel}</span>`
      : '';

    if (song && song.id) {
      // Clickable card → opens song overlay
      return `<button
        onclick="document.getElementById('person-overlay').classList.remove('active'); setTimeout(function(){ openSongOverlay('${song.id}') }, 250)"
        style="display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-radius:12px;background:rgba(165,150,218,.1);border:1px solid rgba(165,150,218,.3);cursor:pointer;text-align:left;width:100%;color:inherit;transition:.15s;"
        onmouseover="this.style.background='rgba(165,150,218,.18)'" onmouseout="this.style.background='rgba(165,150,218,.1)'"
      >
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:0.9em;color:#A596DA;">${roleLabel}</div>
          <div style="font-size:0.85em;opacity:.8;">${songLabel}</div>
          ${noteHTML}
        </div>
        <span style="opacity:.4;font-size:.8em;padding-top:2px;">→</span>
      </button>`;
    } else {
      // Static pill — no matching song found
      return `<div style="display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:0.9em;">${roleLabel}</div>
          <div style="font-size:0.85em;opacity:.7;">${songLabel || '—'}</div>
          ${noteHTML}
        </div>
      </div>`;
    }
  }).join('');

  projectsHTML = `
    <div class="mb-6">
      <h3 class="font-bold mb-3 text-lg">Credits</h3>
      <div style="display:flex;flex-direction:column;gap:8px;">${creditButtons}</div>
    </div>
  `;

} else if (rawProjects.length > 0) {
  // ── LEGACY fallback: plain string array ──
  const projectButtons = rawProjects.map(p => {
    let song = null;
    const songSources = [window.songData, window.songs, window.FALLBACK_SONGS];
    for (const source of songSources) {
      if (!source) continue;
      const arr = Array.isArray(source) ? source : Object.values(source);
      song = arr.find(s => s && s.title && s.title.toLowerCase() === p.toLowerCase());
      if (song) break;
    }
    if (song && song.id) {
      return `<button onclick="document.getElementById('person-overlay').classList.remove('active'); setTimeout(function(){ openSongOverlay('${song.id}') }, 250)" class="px-4 py-2 rounded-full bg-[var(--accent)] text-black font-medium text-sm hover:opacity-90 transition-all cursor-pointer flex items-center gap-2 shadow-lg shadow-[var(--accent-glow)]">${p}</button>`;
    }
    return `<span class="px-3 py-1 rounded-full glass text-sm">${p}</span>`;
  }).join('');
  projectsHTML = `<div class="mb-6"><h3 class="font-bold mb-3 text-lg">Collaborated On:</h3><div class="flex flex-wrap gap-2">${projectButtons}</div></div>`;
}
</script>
