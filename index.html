<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DennisZeroVT — Portfolio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a18;--bg2:#1a1428;--accent:#A596DA;--text:#f5f5f5;--muted:#d6ccf7}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.glass{background:rgba(16,12,28,.65);backdrop-filter:blur(18px);border:1px solid rgba(165,150,218,.18)}
.gradient-text{background:linear-gradient(135deg,var(--accent),#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cat-btn.active-cat{background:rgba(165,150,218,.3)!important;border-color:var(--accent)!important;color:white!important}
.subcat-btn.active-sub{background:rgba(165,150,218,.25)!important}
.page-section{display:none}.page-section.active{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="min-h-screen">
<nav class="fixed top-0 w-full z-40 glass">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl flex items-center justify-center font-bold" style="background:var(--accent);color:#000">DZ</div><span class="font-bold">DennisZeroVT</span></div>
    <div class="hidden md:flex gap-6 text-sm">
      <button data-page="home" class="nav-link">Home</button>
      <button data-page="gamedev" class="nav-link text-[var(--accent)]">Blog</button>
      <a href="blog-editor.html" class="text-xs px-3 py-1 rounded-full bg-[var(--accent)]/20 text-[var(--accent)]">Editor</a>
    </div>
  </div>
</nav>

<main class="pt-20">
<section id="home" class="page-section active"><div class="max-w-4xl mx-auto px-6 py-20 text-center"><h1 class="text-5xl font-bold mb-4">Welcome</h1><p class="text-[var(--muted)]">Use the Blog tab to see posts.</p></div></section>

<section id="gamedev" class="page-section">
<div class="max-w-4xl mx-auto px-4 py-12">
  <div class="text-center mb-10">
    <h1 class="text-5xl font-bold mb-3">Game Dev <span class="gradient-text">Blog</span></h1>
    <p class="text-[var(--muted)]">Live posts from Firebase</p>
  </div>
  
  <div id="category-filters" class="flex flex-wrap gap-2 justify-center mb-4"></div>
  <div id="subcategory-filters" class="flex flex-wrap gap-2 justify-center mb-8 hidden"></div>
  
  <div id="blog-posts-container" class="space-y-8">
    <div class="text-center py-12 text-[var(--muted)]">Loading...</div>
  </div>
</div>
</section>
</main>

<script>
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active')});
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, onSnapshot, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyANgUuiKzFOlFv3gesXvu9VQ36-aS7vhjs",
  authDomain: "denniszerovt-blog.firebaseapp.com",
  projectId: "denniszerovt-blog",
  storageBucket: "denniszerovt-blog.firebasestorage.app",
  messagingSenderId: "438217423363",
  appId: "1:438217423363:web:5db4e6e955494f87e6c36"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allPosts = [];
let categories = [];
let currentCat = 'All';
let currentSub = 'All';

// Default categories
const defaults = [
  {id:'game-dev', name:'Game Dev', color:'#A596DA', subs:['Snowfall','Stuck In Time','Other Projects']},
  {id:'music', name:'Music Production', color:'#ec4899', subs:['Snowfall','Originals','Remixes']},
  {id:'life', name:'Daily Life', color:'#22c55e', subs:['Workflow','Thoughts','Updates','Gear']}
];

async function ensureDefaults(){
  // if no categories, create defaults
  onSnapshot(collection(db,'categories'), snap=>{
    if(snap.empty){
      defaults.forEach(c=> setDoc(doc(db,'categories',c.id), c));
    }
  }, {once:true});
}
ensureDefaults();

function renderCategories(){
  const catWrap = document.getElementById('category-filters');
  catWrap.innerHTML = `<button class="cat-btn px-4 py-2 rounded-full glass text-sm border border-white/10 ${currentCat==='All'?'active-cat':''}" data-cat="All">All</button>` +
    categories.map(c=>`<button class="cat-btn px-4 py-2 rounded-full glass text-sm border border-white/10 ${currentCat===c.name?'active-cat':''}" data-cat="${c.name}" style="--c:${c.color}">${c.name}</button>`).join('');
  
  catWrap.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.onclick = ()=>{
      currentCat = btn.dataset.cat;
      currentSub = 'All';
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active-cat'));
      btn.classList.add('active-cat');
      updateSubs();
      renderPosts();
    };
  });
}

function updateSubs(){
  const subWrap = document.getElementById('subcategory-filters');
  const cat = categories.find(c=>c.name===currentCat);
  if(!cat || currentCat==='All'){ subWrap.classList.add('hidden'); return; }
  subWrap.classList.remove('hidden');
  subWrap.innerHTML = `<button class="subcat-btn px-3 py-1 rounded-full text-xs glass ${currentSub==='All'?'active-sub':''}" data-sub="All">All ${currentCat}</button>` +
    cat.subs.map(s=>`<button class="subcat-btn px-3 py-1 rounded-full text-xs glass ${currentSub===s?'active-sub':''}" data-sub="${s}">${s}</button>`).join('');
  subWrap.querySelectorAll('.subcat-btn').forEach(b=>{
    b.onclick = ()=>{ currentSub=b.dataset.sub; subWrap.querySelectorAll('.subcat-btn').forEach(x=>x.classList.remove('active-sub')); b.classList.add('active-sub'); renderPosts(); };
  });
}

function renderPosts(){
  const cont = document.getElementById('blog-posts-container');
  let filtered = allPosts;
  if(currentCat!=='All') filtered = filtered.filter(p=>p.category===currentCat);
  if(currentSub!=='All') filtered = filtered.filter(p=>p.subcategory===currentSub);
  
  if(filtered.length===0){
    cont.innerHTML = `<div class="text-center py-12 text-[var(--muted)]">No posts yet in this category.</div>`;
    return;
  }
  
  cont.innerHTML = filtered.map(p=>{
    const cat = categories.find(c=>c.name===p.category);
    const color = p.color || cat?.color || '#A596DA';
    const imgs = p.images||[];
    const imgHtml = imgs.length===1 ? `<img src="${imgs[0]}" class="max-w-full rounded-xl mb-4 border border-white/10 mx-auto" style="max-height:500px">` :
      imgs.length>1 ? `<div class="grid grid-cols-2 gap-3 mb-4">${imgs.map(i=>`<img src="${i}" class="rounded-lg border border-white/10 w-full h-48 object-cover">`).join('')}</div>` : '';
    return `<article class="glass rounded-2xl p-8">
      <div class="flex gap-2 items-center mb-3 text-sm"><span class="px-3 py-1 rounded-full" style="background:${color}20;color:${color}">${p.category}</span><span class="opacity-60">${p.subcategory||''}</span><span class="ml-auto opacity-60">${p.displayDate||p.date}</span></div>
      <h3 class="text-2xl font-bold mb-3 gradient-text">${p.title}</h3>
      <p class="text-[var(--muted)] whitespace-pre-wrap mb-3">${p.body}</p>
      ${imgHtml}
    </article>`;
  }).join('');
}

// Listen categories
onSnapshot(collection(db,'categories'), snap=>{
  categories = snap.docs.map(d=>d.data()).sort((a,b)=>a.name.localeCompare(b.name));
  if(categories.length===0) categories = defaults;
  renderCategories();
  updateSubs();
  renderPosts();
});

// Listen posts
onSnapshot(collection(db,'posts'), snap=>{
  allPosts = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  renderPosts();
});
</script>
</body>
</html>
