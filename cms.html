<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dennis CMS — Unified GitHub Manager</title>
<style>
:root{
  --bg:#050507; --bg2:#0b0b12; --glass:rgba(14,14,20,.72); --glass-2:rgba(18,18,26,.6);
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14);
  --text:#e9e9f2; --muted:#9a9ab3; --accent:#A596DA; --accent-2:#7c6bc4;
  --red:#f87171; --green:#34d399; --amber:#fbbf24;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;
  background:var(--bg); color:var(--text); overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:-30%;
  background:
    radial-gradient(700px at 12% 15%, rgba(165,150,218,.18), transparent 60%),
    radial-gradient(600px at 88% 25%, rgba(124,107,196,.14), transparent 60%),
    radial-gradient(500px at 50% 85%, rgba(165,150,218,.10), transparent 60%);
  filter:blur(40px); z-index:-1; animation:float 25s ease-in-out infinite alternate;
}
@keyframes float{to{transform:translateY(-20px) scale(1.03)}}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.6px}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 24px rgba(165,150,218,.45), inset 0 1px 0 rgba(255,255,255,.2);display:grid;place-items:center;color:#0b0714;font-weight:900;font-size:13px}
.tabs{display:flex;gap:6px;flex:1;overflow:auto;padding:2px}
.tab{padding:8px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.4px;cursor:pointer;white-space:nowrap;transition:.18s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.active{color:var(--text);background:rgba(165,150,218,.14);border-color:rgba(165,150,218,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(165,150,218,.08) inset}
.connect{display:flex;gap:8px;align-items:center}
.connect input{width:200px;background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:10px;font-size:13px;outline:none}
.connect input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(165,150,218,.18)}
.btn{padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#0e0a18;box-shadow:0 8px 22px rgba(165,150,218,.28)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.28);color:#fecaca}
.btn.danger:hover{background:rgba(248,113,113,.2)}
.workspace{display:grid;grid-template-columns:330px 1fr;gap:14px;padding:14px;flex:1;min-height:0}
.sidebar{border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;border-bottom:1px solid var(--border)}
.side-head h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800}
.list{overflow:auto;padding:10px;flex:1;display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:11px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;align-items:center;transition:.15s;background:rgba(0,0,0,.18)}
.item:hover{background:rgba(255,255,255,.05);border-color:var(--border)}
.item.active{background:rgba(165,150,218,.12);border-color:rgba(165,150,218,.3)}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#0d0d14;flex-shrink:0;display:grid;place-items:center;font-size:22px;border:1px solid var(--border);overflow:hidden}
.meta{min-width:0;flex:1}
.meta .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(165,150,218,.15);color:var(--accent);border:1px solid rgba(165,150,218,.25);text-transform:uppercase;letter-spacing:.3px}
.badge.friend{background:rgba(52,211,153,.15);color:#6ee7b7;border-color:rgba(52,211,153,.25)}
.badge.collab{background:rgba(251,191,36,.15);color:#fcd34d;border-color:rgba(251,191,36,.25)}
.editor{border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ed-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.ed-head .title{font-weight:800;font-size:15px;letter-spacing:.3px}
.ed-actions{display:flex;gap:8px}
.ed-body{overflow:auto;padding:18px;flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
input[type="text"],input[type="number"],input[type="date"],input[type="password"],select,textarea{
  background:rgba(0,0,0,.32);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:10px;font-size:14px;outline:none;transition:.18s;width:100%;font-family:inherit
}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(165,150,218,.16)}
.color-row{display:flex;gap:10px;align-items:center}
input[type="color"]{width:44px;height:38px;padding:0;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:22px;background:rgba(255,255,255,.12);border-radius:999px;position:relative;border:1px solid var(--border);transition:.2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:white;transition:.2s}
.switch input:checked{background:rgba(165,150,218,.5);border-color:var(--accent)}
.switch input:checked::after{left:18px;background:#0e0a18}
.blocks{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.block{background:var(--glass-2);border:1px solid var(--border);border-radius:14px;padding:12px}
.block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.block-type{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);text-transform:uppercase}
.block-ctrls{display:flex;gap:6px}
.icon{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--border);cursor:pointer;font-size:14px;transition:.15s}
.icon:hover{background:rgba(255,255,255,.12)}
.divider-prev{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:8px 0;border-radius:2px}
.img-prev{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--border);cursor:zoom-in;display:block}
.upload{display:flex;gap:8px;align-items:center}
.upload input[type="file"]{display:none}
.file-btn{padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.06);border:1px dashed var(--border-2);cursor:pointer;font-size:12.5px;font-weight:700}
.file-btn:hover{background:rgba(255,255,255,.1)}
.tracks{display:flex;flex-direction:column;gap:8px}
.track{display:grid;grid-template-columns:1fr 90px 110px 130px 32px;gap:8px;align-items:center;background:rgba(0,0,0,.22);padding:8px;border-radius:10px;border:1px solid var(--border)}
.track .icon{width:30px;height:32px}
.links-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:12px;text-align:center;padding:40px}
.empty .big{font-size:42px;opacity:.7}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:rgba(0,0,0,.4);gap:10px}
.status-msg{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.5)}
.dot.err{background:var(--red)}
.dot.work{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px);padding:20px}
.modal.show{display:flex}
.modal img{max-width:92vw;max-height:88vh;border-radius:12px;border:1px solid var(--border)}
.alert{padding:10px 12px;border-radius:10px;font-size:13px;border:1px solid;margin-bottom:12px}
.alert.warn{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:#fde68a}
.audio{width:100%;margin-top:8px;background:rgba(0,0,0,.3);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);font-size:12px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.1)}
.sep{height:1px;background:var(--border);margin:14px 0}
@media (max-width:980px){
  .workspace{grid-template-columns:1fr; padding:10px}
  .sidebar{max-height:38vh}
  .form{grid-template-columns:1fr}
  .links-grid{grid-template-columns:1fr}
  .track{grid-template-columns:1fr 80px 100px 32px}
  .track select:nth-child(3){display:none}
  .connect input{width:140px}
  .topbar{flex-wrap:wrap}
  .tabs{order:3;width:100%}
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(165,150,218,.25);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(165,150,218,.4);background-clip:padding-box}
</style>
</head>

const state = {
  token: localStorage.getItem('dzcms_token')||'',
  connected:false,
  shas:{},
  data:{ posts:[], songs:[], people:[], albums:[], categories:[] },
  tab:'blog',

};

const $ = s=>document.querySelector(s);

function setStatus(msg, type=''){
  statusEl.textContent = msg;
  dotEl.className = 'dot ' + (type==='ok'?'ok':type==='err'?'err':type==='work'?'work':'');
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))) }
function b64dec(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))) }
function today(){ return new Date().toISOString().slice(0,10) }
function ghUrl(path){ return `https://${OWNER}.github.io/${path}` }

async function ghFetch(path, opts={}){
  const url = `https://api.github.com/repos/${REPO}/contents/${path}${opts.ref?`?ref=${opts.ref}`:''}`;
  const res = await fetch(url, {
    ...opts,
    headers:{ 'Authorization':`token ${state.token}`, 'Accept':'application/vnd.github.v3+json', ...opts.headers }
  });
  if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}
async function getFile(path){
  const data = await ghFetch(path, {ref:BRANCH});
  state.shas[path]=data.sha;
  const content = b64dec(data.content);
  return JSON.parse(content);
}
async function putFile(path, obj, message){
  const content = b64enc(JSON.stringify(obj,null,2));
  const body = { message, content, branch:BRANCH, sha:state.shas[path] };
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{
    method:'PUT',
    headers:{ 'Authorization':`token ${state.token}`, 'Content-Type':'application/json' },
    body:JSON.stringify(body)
  });
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.message||res.statusText) }
  const data = await res.json();
  state.shas[path]=data.content.sha;
  return data;
}
async function uploadFile(file, dest){
  const buf = await file.arrayBuffer();
  let binary=''; const bytes=new Uint8Array(buf); for(let i=0;i<bytes.byteLength;i++) binary+=String.fromCharCode(bytes[i]);
  const content = btoa(binary);
  let sha=null;
  try{ const info = await ghFetch(dest,{ref:BRANCH}); sha=info.sha; }catch{}
  const body={message:`upload ${dest}`,content,branch:BRANCH, ...(sha?{sha}:{})};
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${dest}`,{
    method:'PUT', headers:{'Authorization':`token ${state.token}`,'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!res.ok) throw new Error('Upload failed');
  return ghUrl(dest);
}

function migratePosts(posts){
  return posts.map(p=>{
    if(p.blocks) return p;
    const blocks=[];
    if(p.body) blocks.push({type:'text',content:p.body});
    if(Array.isArray(p.images)) p.images.forEach(src=>blocks.push({type:'image',src,caption:''}));
    return {...p, blocks};
  });
}

async function connect(){
  if(!state.token){ alert('Enter GitHub token'); return }
  localStorage.setItem('dzcms_token', state.token);
  setStatus('Connecting to GitHub…','work');
  try{
    const [posts,songs,people,albums,categories] = await Promise.all([
      getFile(PATHS.posts).catch(()=>FALLBACK_POSTS),
      getFile(PATHS.songs).catch(()=>FALLBACK_SONGS),
      getFile(PATHS.people).catch(()=>FALLBACK_PEOPLE),
      getFile(PATHS.albums).catch(()=>FALLBACK_ALBUMS),
      getFile(PATHS.categories).catch(()=>FALLBACK_CATEGORIES),
    ]);
    state.data.posts = migratePosts(posts);
    state.data.songs = songs;
    state.data.people = people;
    state.data.albums = albums;
    state.data.categories = categories;
    state.connected = true;
    setStatus('Connected • Synced','ok');
    render();
  }catch(e){
    console.error(e);
    setStatus('Connection failed: '+e.message,'err');
    // still load fallbacks for offline editing
    state.data.posts = FALLBACK_POSTS;
    state.data.songs = FALLBACK_SONGS;
    state.data.people = FALLBACK_PEOPLE;
    state.data.albums = FALLBACK_ALBUMS;
    state.data.categories = FALLBACK_CATEGORIES;
    render();
  }
}

function render(){
  renderTabs();
  renderList();
  renderEditor();
}
function renderTabs(){
  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===state.tab);
  });
  listTitle.textContent = state.tab==='blog'?'Blog Posts':state.tab==='songs'?'Songs':state.tab==='people'?'People':'Albums';
}
function renderList(){
  listEl.innerHTML='';
  const data = getCurrentArray();
  const items = [...data].sort((a,b)=>{
    if(state.tab==='blog') return (b.date||'').localeCompare(a.date||'');
    if(state.tab==='songs' || state.tab==='albums') return (b.year||0)-(a.year||0);
    return (a.name||'').localeCompare(b.name||'');
  });
  items.forEach(it=>{
    const div=document.createElement('div');
    div.className='item'+(it.id===state.currentId?' active':'');
    div.onclick=()=>{ state.currentId=it.id; renderList(); renderEditor(); };
    const thumb = document.createElement('div'); thumb.className='thumb';
    if(state.tab==='blog'){
      const firstImg = (it.blocks||[]).find(b=>b.type==='image')?.src;
      if(firstImg){ const img=document.createElement('img'); img.src=firstImg; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; thumb.appendChild(img); } else thumb.textContent='📝';
    } else if(state.tab==='songs'){
      if(it.cover){ const img=document.createElement('img'); img.src=it.cover; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; thumb.appendChild(img);} else thumb.textContent=it.coverEmoji||'🎵';
    } else if(state.tab==='people'){
      if(it.avatar){ const img=document.createElement('img'); img.src=it.avatar; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; thumb.appendChild(img);} else thumb.textContent=it.icon||'👤';
    } else if(state.tab==='categories'){
      thumb.style.background = it.color+'20'; thumb.style.borderColor = it.color+'40'; thumb.style.color = it.color; thumb.textContent = it.name.charAt(0); thumb.style.fontWeight='700';
    } else {
      if(it.cover){ const img=document.createElement('img'); img.src=it.cover; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; thumb.appendChild(img);} else thumb.textContent='💿';
    }
    const meta=document.createElement('div'); meta.className='meta';
    const t=document.createElement('div'); t.className='t'; t.textContent= state.tab==='blog'?it.title:it.name||it.title;
    const s=document.createElement('div'); s.className='s';
    if(state.tab==='blog') s.innerHTML=`<span>${it.category||''}</span> • <span>${it.date||''}</span>`;
    else if(state.tab==='songs') s.innerHTML=`<span>${it.artist||''}</span> • <span>${it.year||''}</span>`;
    else if(state.tab==='people'){ s.innerHTML=''; (it.tags||[]).forEach(tag=>{ const b=document.createElement('span'); b.className='badge '+tag; b.textContent=tag; s.appendChild(b); }); }
    else if(state.tab==='categories'){ s.innerHTML=`<span class="badge" style="background:${it.color}20;color:${it.color};border-color:${it.color}40">${it.id}</span> • <span>${it.subs.length} subs</span>`; }
    else s.innerHTML=`<span>${it.status||''}</span> • <span>${it.year||''}</span>`;
    meta.appendChild(t); meta.appendChild(s);
    div.appendChild(thumb); div.appendChild(meta);
    listEl.appendChild(div);
  });
}
function getCurrentArray(){
  return state.tab==='blog'?state.data.posts:state.tab==='songs'?state.data.songs:state.tab==='people'?state.data.people:state.tab==='categories'?state.data.categories:state.data.albums;
}
function getCurrentItem(){
  return getCurrentArray().find(x=>x.id===state.currentId);
}

function renderEditor(){
  const item = getCurrentItem();
  if(!item){
    editorEl.innerHTML=`<div class="empty"><div class="big">✦</div><div>Select an item or create new<br><span class="hint">Data is stored in /data/*.json</span></div></div>`;
    return;
  }
  if(state.tab==='blog') renderBlogEditor(item);
  else if(state.tab==='songs') renderSongEditor(item);
  else if(state.tab==='people') renderPeopleEditor(item);
  else if(state.tab==='categories') renderCategoryEditor(item);
  else renderAlbumEditor(item);
}

  function renderBlocks(p){
    const wrap = $('#blocks'); wrap.innerHTML='';
    (p.blocks||[]).forEach((bl,i)=>{
      const d=document.createElement('div'); d.className='block';
      d.innerHTML=`<div class="block-head"><div class="block-type">${bl.type}</div><div class="block-ctrls">
        <div class="icon" title="Up">↑</div><div class="icon" title="Down">↓</div><div class="icon" title="Delete">✕</div></div></div>
        <div class="block-body"></div>`;
      const [up,down,del]=d.querySelectorAll('.icon');
      up.onclick=()=>{ if(i>0){ [p.blocks[i-1],p.blocks[i]]=[p.blocks[i],p.blocks[i-1]]; renderBlocks(p);} };
      down.onclick=()=>{ if(i<p.blocks.length-1){ [p.blocks[i+1],p.blocks[i]]=[p.blocks[i],p.blocks[i+1]]; renderBlocks(p);} };
      del.onclick=()=>{ p.blocks.splice(i,1); renderBlocks(p); };
      const body=d.querySelector('.block-body');
      if(bl.type==='text'){
        body.innerHTML=`<textarea data-k="content" placeholder="Write...">${esc(bl.content||'')}</textarea>`;
      }else if(bl.type==='image'){
        body.innerHTML=`
          <div class="upload"><label class="file-btn">Choose image<input type="file" accept="image/*"></label><span class="hint">${bl.src? 'Uploaded':'No file'}</span></div>
          ${bl.src?`<img class="img-prev" src="${bl.src}" alt="">`:''}
          <div style="margin-top:8px"><input type="text" data-k="caption" placeholder="Caption (optional)" value="${esc(bl.caption||'')}"></div>
        `;
        const fileInp=body.querySelector('input[type=file]');
        const img=body.querySelector('img');
        if(img) img.onclick=()=>showImg(bl.src);
        fileInp.onchange=async e=>{
          const f=e.target.files[0]; if(!f) return;
          try{ setStatus('Uploading image…','work'); const url=await uploadFile(f, `${UPLOADS.posts}${Date.now()}-${f.name.replace(/\s+/g,'-')}`); bl.src=url; setStatus('Image uploaded','ok'); renderBlocks(p);}catch(err){ setStatus('Upload failed','err'); alert(err.message) }
        };
      }else{
        body.innerHTML=`<div class="divider-prev"></div><span class="hint">Visual separator</span>`;
      }
      body.querySelectorAll('[data-k]').forEach(inp=>{ inp.oninput=()=>{ bl[inp.dataset.k]=inp.value } });
      wrap.appendChild(d);
    });
  }
  renderBlocks(post);
}
async function saveBlog(){
  const p=getCurrentItem(); if(!p) return;
  p.title=$('#f_title').value.trim()||'Untitled';
  p.date=$('#f_date').value||today();
  p.category=$('#f_cat').value;
  p.subcategory=$('#f_sub').value;
  p.color=$('#f_color').value;
  p.id = p.id || slugify(p.title+'-'+p.date);
  try{
    setStatus('Saving post…','work');
    const arr=state.data.posts; const idx=arr.findIndex(x=>x.id===p.id); if(idx>=0) arr[idx]=p; else arr.push(p);
    await putFile(PATHS.posts, arr, `blog: ${p.title}`);
    setStatus('Post saved','ok'); renderList();
  }catch(e){ setStatus('Save failed','err'); alert(e.message) }
}
async function deleteBlog(){
  const p=getCurrentItem(); if(!p) return; if(!confirm('Delete this post?')) return;
  try{
    setStatus('Deleting…','work');
    state.data.posts = state.data.posts.filter(x=>x.id!==p.id);
    await putFile(PATHS.posts, state.data.posts, `delete post: ${p.title}`);
    state.currentId=null; setStatus('Deleted','ok'); render();
  }catch(e){ setStatus('Delete failed','err'); alert(e.message) }
}

async function savePerson(){
  const p=getCurrentItem(); if(!p) return;
  p.name=$('#p_name').value.trim(); p.handle=$('#p_handle').value.trim(); p.role=$('#p_role').value.trim(); p.icon=$('#p_icon').value.trim();
  p.avatar=$('#p_avatar').value.trim(); p.bio=$('#p_bio').value; p.color=$('#p_color').value.trim();
  p.tags=[]; if($('#p_friend').checked) p.tags.push('friend'); if($('#p_collab').checked) p.tags.push('collab');
  p.showOnHome=$('#p_home').checked;
  p.projects=$('#p_projects').value.split(',').map(x=>x.trim()).filter(Boolean);
  p.links={ twitter:$('#p_twitter').value, spotify:$('#p_spotify').value, instagram:$('#p_instagram').value, website:$('#p_website').value };
  p.id = p.id || slugify(p.name);
  try{ setStatus('Saving person…','work'); const arr=state.data.people; const i=arr.findIndex(x=>x.id===p.id); if(i>=0) arr[i]=p; else arr.push(p); await putFile(PATHS.people, arr, `person: ${p.name}`); setStatus('Person saved','ok'); renderList(); }catch(e){ setStatus('Save failed','err'); alert(e.message) }
}
async function deletePerson(){ const p=getCurrentItem(); if(!p||!confirm('Delete person?')) return; try{ setStatus('Deleting…','work'); state.data.people=state.data.people.filter(x=>x.id!==p.id); await putFile(PATHS.people, state.data.people, `delete person: ${p.name}`); state.currentId=null; setStatus('Deleted','ok'); render(); }catch(e){ setStatus('Delete failed','err'); } }

function renderCategoryEditor(item){
  editorShell('Edit Category', saveCategories, ()=>deleteItem('categories'));
  const wrap = document.createElement('div'); wrap.className='form';
  wrap.innerHTML = `
    <div class="field"><label>ID (slug)</label><input type="text" value="${item.id||''}" oninput="item.id=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'-');state.dirty=true"><div class="hint">lowercase-with-dashes</div></div>
    <div class="field"><label>Name</label><input type="text" value="${item.name||''}" oninput="item.name=this.value;state.dirty=true;document.getElementById('catPrev').textContent=this.value"></div>
    <div class="field"><label>Color</label><div class="color-row"><input type="color" value="${item.color||'#A596DA'}" oninput="item.color=this.value;state.dirty=true;updateCatPreview()"><input type="text" value="${item.color||'#A596DA'}" oninput="item.color=this.value;state.dirty=true;updateCatPreview()"></div></div>
    <div class="field"><label>Preview</label><div style="padding:10px;background:rgba(0,0,0,.3);border-radius:8px"><span class="badge" id="catPrev" style="background:${(item.color||'#A596DA')}20;color:${item.color||'#A596DA'};border-color:${(item.color||'#A596DA')}40">${item.name||''}</span></div></div>
    <div class="field full"><label>Subcategories</label><div id="subsList" class="chips" style="min-height:42px;padding:8px;background:rgba(0,0,0,.2);border-radius:8px;border:1px solid var(--border)"></div><div class="row" style="margin-top:8px"><input type="text" id="newSub" placeholder="Add subcategory..." style="flex:1"><button class="btn small" onclick="addCategorySub()">+ Add</button></div></div>
  `;
  document.querySelector('.ed-body').appendChild(wrap);
  renderSubs();
  document.getElementById('newSub').addEventListener('keydown', e=>{ if(e.key==='Enter'){ addCategorySub(); e.preventDefault(); }});
  window.updateCatPreview = ()=>{ const p=document.getElementById('catPrev'); if(p){ p.style.background=item.color+'20'; p.style.color=item.color; p.style.borderColor=item.color+'40'; } };
}
function renderSubs(){
  const item = getCurrentItem(); const box = document.getElementById('subsList'); if(!box) return;
  box.innerHTML = (item.subs||[]).map((s,i)=>`<span class="chip" onclick="removeCategorySub(${i})">${s} ×</span>`).join('') || '<span class="hint">No subs yet</span>';
}
function addCategorySub(){ const item=getCurrentItem(); const inp=document.getElementById('newSub'); const v=inp.value.trim(); if(!v) return; item.subs=item.subs||[]; item.subs.push(v); inp.value=''; state.dirty=true; renderSubs(); renderList(); }
function removeCategorySub(i){ const item=getCurrentItem(); item.subs.splice(i,1); state.dirty=true; renderSubs(); renderList(); }
async function saveCategories(){ try{ setStatus('Saving categories.json…','work'); await putFile(PATHS.categories, state.data.categories, 'cms: update categories'); setStatus('Categories saved ✓','ok'); state.dirty=false; }catch(e){ setStatus('Save failed: '+e.message,'err'); } }

function renderAlbumEditor(a){
  const body = editorShell('Edit Album', saveAlbum, deleteAlbum);
  body.innerHTML=`
    <div class="form">
      <div class="field"><label>Name</label><input id="a_name" value="${esc(a.name||'')}"></div>
      <div class="field"><label>Artist</label><input id="a_artist" value="${esc(a.artist||'Dennis Zero VT')}"></div>
      <div class="field"><label>Year</label><input id="a_year" type="number" value="${a.year||new Date().getFullYear()}"></div>
      <div class="field"><label>Status</label><select id="a_status">${['In Progress','Released','Planned'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field full"><label>Cover</label>
        <div class="upload"><label class="file-btn">Upload cover<input type="file" accept="image/*" id="a_coverfile"></label></div>
        ${a.cover?`<img class="img-prev" src="${a.cover}" onclick="showImg('${a.cover}')">`:''}
        <input id="a_cover" type="text" value="${esc(a.cover||'')}" placeholder="Cover URL" style="margin-top:8px">
      </div>
      <div class="field full"><label>Description</label><textarea id="a_desc">${esc(a.description||'')}</textarea></div>
      <div class="field full">
        <label>Tracklist</label>
        <div class="tracks" id="tracks"></div>
        <button class="btn small" id="addTrack" style="margin-top:8px">+ Add Track</button>
      </div>
    </div>
  `;
  $('#a_coverfile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ setStatus('Uploading…','work'); const url=await uploadFile(f, `${UPLOADS.covers}${Date.now()}-${f.name.replace(/\s+/g,'-')}`); $('#a_cover').value=url; setStatus('Uploaded','ok'); }catch{ setStatus('Upload failed','err') } };
  const tracksWrap=$('#tracks');
  function renderTracks(){
    tracksWrap.innerHTML='';
    (a.tracklist||[]).forEach((t,i)=>{
      const row=document.createElement('div'); row.className='track';
      row.innerHTML=`
        <input value="${esc(t.name||'')}" placeholder="Track name" data-k="name">
        <input value="${esc(t.duration||'')}" placeholder="3:24" data-k="duration">
        <select data-k="status">${['planned','in-progress','released'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>
        <select data-k="key"><option value="">— link song —</option>${state.data.songs.map(s=>`<option value="${s.id}" ${t.key===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
        <div class="icon" title="Delete">✕</div>
      `;
      row.querySelectorAll('[data-k]').forEach(inp=>inp.oninput=()=>t[inp.dataset.k]=inp.value);
      row.querySelector('.icon').onclick=()=>{ a.tracklist.splice(i,1); renderTracks(); };
      tracksWrap.appendChild(row);
    });
  }
  a.tracklist = a.tracklist||[];
  renderTracks();
  $('#addTrack').onclick=()=>{ a.tracklist.push({name:'',duration:'',status:'planned',key:''}); renderTracks(); };
}
async function saveAlbum(){
  const a=getCurrentItem(); if(!a) return;
  a.name=$('#a_name').value.trim(); a.artist=$('#a_artist').value.trim(); a.year=parseInt($('#a_year').value)||new Date().getFullYear();
  a.status=$('#a_status').value; a.cover=$('#a_cover').value.trim(); a.description=$('#a_desc').value;
  a.id = a.id || slugify(a.name);
  try{ setStatus('Saving album…','work'); const arr=state.data.albums; const i=arr.findIndex(x=>x.id===a.id); if(i>=0) arr[i]=a; else arr.push(a); await putFile(PATHS.albums, arr, `album: ${a.name}`); setStatus('Album saved','ok'); renderList(); }catch(e){ setStatus('Save failed','err'); alert(e.message) }
}
async function deleteAlbum(){ const a=getCurrentItem(); if(!a||!confirm('Delete album?')) return; try{ setStatus('Deleting…','work'); state.data.albums=state.data.albums.filter(x=>x.id!==a.id); await putFile(PATHS.albums, state.data.albums, `delete album: ${a.name}`); state.currentId=null; setStatus('Deleted','ok'); render(); }catch(e){ setStatus('Delete failed','err'); } }

function esc(s){ return (s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])) }
function showImg(src){ $('#modalImg').src=src; $('#modal').classList.add('show') }

$('#tabs').onclick=e=>{
  const btn=e.target.closest('.tab'); if(!btn) return;
  state.tab=btn.dataset.tab; state.currentId=null; render();
};
$('#btnNew').onclick=()=>{
  const arr=getCurrentArray();
  if(state.tab==='blog'){ const id='post-'+Date.now(); arr.unshift({id,title:'New Post',category:'Daily Life',subcategory:'',date:today(),color:'#A596DA',blocks:[{type:'text',content:''}]}); state.currentId=id; }
  else if(state.tab==='songs'){ const id='song-'+Date.now(); arr.unshift({id,title:'New Song',artist:'Dennis Zero VT',year:new Date().getFullYear(),coverEmoji:'🎵',badges:[],streaming:{},about:'',thoughts:'',miscellaneous:'',behindTheScenes:''}); state.currentId=id; }
  else if(state.tab==='people'){ const id='person-'+Date.now(); arr.unshift({id,name:'New Person',handle:'',role:'',avatar:'',bio:'',tags:['friend'],links:{},projects:[],color:'text-purple-400',icon:'👤',showOnHome:true}); state.currentId=id; }
  else { const id='album-'+Date.now(); arr.unshift({id,name:'New Album',artist:'Dennis Zero VT',year:new Date().getFullYear(),cover:'',status:'In Progress',description:'',tracklist:[]}); state.currentId=id; }
  render();
};
$('#btnConnect').onclick=()=>{ state.token=$('#token').value.trim(); connect(); };

(function init(){
  $('#token').value = state.token;
  setStatus('Ready — enter token to connect');
  // load fallbacks for UI preview
  state.data.posts = migratePosts(FALLBACK_POSTS);
  state.data.songs = FALLBACK_SONGS;
  state.data.people = FALLBACK_PEOPLE;
  state.data.albums = FALLBACK_ALBUMS;
  state.data.categories = FALLBACK_CATEGORIES;
  renderList();
})();
</script>
