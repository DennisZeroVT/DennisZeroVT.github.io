<!-- ── 2. renderPeopleEditor(p) — replace the existing function ── -->
<script id="patch-render-people-editor">
// CREDIT ROLE OPTIONS — add more as needed
const CREDIT_ROLES = [
  'Drums', 'Guitar', 'Bass', 'Piano / Keys', 'Vocals', 'Backing Vocals',
  'Lyrics', 'Melody', 'Mixing', 'Mastering', 'Artwork', 'Inspiration',
  'Producer', 'Co-producer', 'Songwriter', 'Featured Artist', 'Other'
];

function renderPeopleEditor(p){
  const body = editorShell('Edit Person', savePerson, deletePerson);

  // Normalise: support legacy "projects" array (strings) → credits objects
  if (!p.credits && p.projects) {
    p.credits = (p.projects || []).map(title => ({ song: title, songId: '', role: 'Collaborator', note: '' }));
  }
  p.credits = p.credits || [];

  body.innerHTML = `
    <div class="alert warn">Avatars upload to <b>Friends/</b>. Use square PNG for best results.</div>
    <div class="form">
      <div class="field"><label>Name</label><input id="p_name" value="${esc(p.name||'')}"></div>
      <div class="field"><label>Handle</label><input id="p_handle" value="${esc(p.handle||'')}"></div>
      <div class="field"><label>Role / tagline</label><input id="p_role" value="${esc(p.role||'')}"></div>
      <div class="field"><label>Icon (Font Awesome class or emoji)</label><input id="p_icon" value="${esc(p.icon||'👤')}"></div>
      <div class="field full"><label>Avatar</label>
        <div class="upload"><label class="file-btn">Upload avatar<input type="file" accept="image/*" id="p_avfile"></label><span class="hint">${p.avatar?'Uploaded':''}</span></div>
        ${p.avatar ? `<img class="img-prev" src="${p.avatar}" style="max-height:120px" onclick="showImg('${p.avatar}')">` : ''}
        <input id="p_avatar" type="text" value="${esc(p.avatar||'')}" placeholder="Avatar URL" style="margin-top:8px">
      </div>
      <div class="field full"><label>Bio</label><textarea id="p_bio">${esc(p.bio||'')}</textarea></div>
      <div class="field">
        <label>Tags</label>
        <div class="row">
          <label class="switch"><input type="checkbox" id="p_friend" ${p.tags?.includes('friend')?'checked':''}><span>friend</span></label>
          <label class="switch"><input type="checkbox" id="p_collab" ${p.tags?.includes('collab')?'checked':''}><span>collab</span></label>
        </div>
      </div>
      <div class="field"><label>Show on Home</label><label class="switch"><input type="checkbox" id="p_home" ${p.showOnHome?'checked':''}><span>Visible</span></label></div>
      <div class="field"><label>Color class</label><input id="p_color" value="${esc(p.color||'from-purple-500/30 to-purple-600/10')}" placeholder="from-purple-500/30 to-purple-600/10"></div>

      <!-- ── CREDITS ── -->
      <div class="field full">
        <label>Credits (what they did on each song)</label>
        <div id="p_credits_wrap" style="display:flex;flex-direction:column;gap:10px;margin-top:6px"></div>
        <button class="btn small" id="p_addcredit" style="margin-top:10px;align-self:flex-start">+ Add Credit</button>
        <div class="hint" style="margin-top:6px">Each credit links this person to a specific song with their exact contribution.</div>
      </div>

      <!-- ── LINKS ── -->
      <div class="field full"><label>Links</label>
        <div class="links-grid">
          ${['twitter','spotify','instagram','website'].map(k=>`<div><label class="hint">${k}</label><input id="p_${k}" value="${esc(p.links?.[k]||'')}"></div>`).join('')}
        </div>
      </div>
    </div>
  `;

  // Avatar upload
  $('#p_avfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { setStatus('Uploading avatar…','work'); const url = await uploadFile(f, `${UPLOADS.people}${Date.now()}-${f.name.replace(/\s+/g,'-')}`); $('#p_avatar').value = url; setStatus('Avatar uploaded','ok'); }
    catch { setStatus('Upload failed','err'); }
  };

  // ── Credit row renderer ──
  function renderCreditRows() {
    const wrap = $('#p_credits_wrap');
    wrap.innerHTML = '';
    p.credits.forEach((cr, i) => {
      const songOptions = (state.data.songs || []).map(s =>
        `<option value="${s.id}" ${cr.songId === s.id ? 'selected' : ''}>${esc(s.title)}</option>`
      ).join('');
      const roleOptions = CREDIT_ROLES.map(r =>
        `<option value="${r}" ${cr.role === r ? 'selected' : ''}>${r}</option>`
      ).join('');

      const row = document.createElement('div');
      row.style.cssText = 'background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;align-items:start';
      row.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:6px">
          <label class="hint">Song</label>
          <select class="cr_song">
            <option value="">— pick a song —</option>
            ${songOptions}
          </select>
          <input class="cr_song_title" type="text" placeholder="Or type title manually" value="${esc(cr.song||'')}" style="margin-top:4px;font-size:12px;opacity:.7">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label class="hint">Role / Contribution</label>
          <select class="cr_role">
            ${roleOptions}
            ${!CREDIT_ROLES.includes(cr.role) && cr.role ? `<option value="${esc(cr.role)}" selected>${esc(cr.role)}</option>` : ''}
          </select>
          <input class="cr_note" type="text" placeholder="Short note (optional)" value="${esc(cr.note||'')}" style="margin-top:4px;font-size:12px;opacity:.7">
        </div>
        <div class="icon" title="Remove" style="margin-top:20px">✕</div>
      `;

      // Sync song dropdown → title
      const songSel  = row.querySelector('.cr_song');
      const songTitle = row.querySelector('.cr_song_title');
      const roleSel  = row.querySelector('.cr_role');
      const noteInp  = row.querySelector('.cr_note');
      const delBtn   = row.querySelector('.icon');

      songSel.onchange = () => {
        const found = (state.data.songs||[]).find(s => s.id === songSel.value);
        if (found) { cr.songId = found.id; cr.song = found.title; songTitle.value = found.title; }
        else { cr.songId = ''; }
      };
      songTitle.oninput = () => { cr.song = songTitle.value; };
      roleSel.onchange  = () => { cr.role = roleSel.value; };
      noteInp.oninput   = () => { cr.note = noteInp.value; };
      delBtn.onclick    = () => { p.credits.splice(i, 1); renderCreditRows(); };

      wrap.appendChild(row);
    });
  }

  renderCreditRows();
  $('#p_addcredit').onclick = () => {
    p.credits.push({ song: '', songId: '', role: 'Collaborator', note: '' });
    renderCreditRows();
  };
}
</script>


<!-- ── 3. savePerson() — replace the existing function ── -->
<script id="patch-save-person">
async function savePerson(){
  const p = getCurrentItem(); if (!p) return;
  p.name    = $('#p_name').value.trim();
  p.handle  = $('#p_handle').value.trim();
  p.role    = $('#p_role').value.trim();
  p.icon    = $('#p_icon').value.trim();
  p.avatar  = $('#p_avatar').value.trim();
  p.bio     = $('#p_bio').value;
  p.color   = $('#p_color').value.trim();
  p.tags    = [];
  if ($('#p_friend').checked) p.tags.push('friend');
  if ($('#p_collab').checked) p.tags.push('collab');
  p.showOnHome = $('#p_home').checked;
  // credits are mutated live; just ensure the field exists
  p.credits = p.credits || [];
  // keep legacy projects field in sync for any old code that reads it
  p.projects = p.credits.map(c => c.song).filter(Boolean);
  p.links = {
    twitter:   $('#p_twitter').value,
    spotify:   $('#p_spotify').value,
    instagram: $('#p_instagram').value,
    website:   $('#p_website').value
  };
  p.id = p.id || slugify(p.name);
  try {
    setStatus('Saving person…','work');
    const arr = state.data.people;
    const i = arr.findIndex(x => x.id === p.id);
    if (i >= 0) arr[i] = p; else arr.push(p);
    await putFile(PATHS.people, arr, `person: ${p.name}`);
    setStatus('Person saved','ok');
    renderList();
  } catch(e) { setStatus('Save failed','err'); alert(e.message); }
}
</script>
