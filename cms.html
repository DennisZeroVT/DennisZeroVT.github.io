<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CMS</title>
<style>body{background:#111;color:#eee;font-family:system-ui;padding:20px}input,select,textarea{width:100%;margin:4px 0;padding:8px;background:#222;color:#eee;border:1px solid #444}button{padding:10px 16px;margin:8px 4px;background:#1DB954;color:#000;border:0;font-weight:700;cursor:pointer}.song{border:1px solid #333;padding:16px;margin:16px 0;border-radius:12px}.platform{display:grid;grid-template-columns:1fr 120px 1fr;gap:8px;align-items:center}</style>
</head><body>
<h1>Song CMS - badges</h1>
<input type="file" id="file" accept=".json">
<div id="list"></div>
<button onclick="download()">Download songs.json</button>

<script>
let songs=[];
document.getElementById('file').onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{songs=JSON.parse(r.result);render()};
  r.readAsText(e.target.files[0]);
};
function render(){
  document.getElementById('list').innerHTML=songs.map((s,i)=>`
  <div class="song">
    <h3>${s.title}</h3>
    <input value="${s.title}" onchange="songs[${i}].title=this.value" placeholder="Title">
    <textarea onchange="songs[${i}].description=this.value">${s.description}</textarea>
    ${s.platforms.map((p,pi)=>`
      <div class="platform">
        <input value="${p.name}" onchange="songs[${i}].platforms[${pi}].name=this.value">
        <select onchange="songs[${i}].platforms[${pi}].status=this.value">
          <option ${p.status==='released'?'selected':''}>released</option>
          <option ${p.status==='pending'?'selected':''}>pending</option>
          <option ${p.status==='coming'?'selected':''}>coming</option>
        </select>
        <input value="${p.url}" placeholder="url" onchange="songs[${i}].platforms[${pi}].url=this.value">
      </div>`).join('')}
  </div>`).join('');
}
function download(){
  const blob=new Blob([JSON.stringify(songs,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='songs.json';a.click();
}
// load default
fetch('../data/songs.json').then(r=>r.json()).then(d=>{songs=d;render()}).catch(()=>{});
</script>
</body></html>
