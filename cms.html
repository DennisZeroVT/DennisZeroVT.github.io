<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dennis CMS — Unified GitHub Manager</title>
<style>
:root{
  --bg:#050507; --bg2:#0b0b12; --glass:rgba(14,14,20,.72); --glass-2:rgba(18,18,26,.6);
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14);
  --text:#e9e9f2; --muted:#9a9ab3; --accent:#A596DA; --accent-2:#7c6bc4;
  --red:#f87171; --green:#34d399; --amber:#fbbf24;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;
  background:var(--bg); color:var(--text); overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:-30%;
  background:
    radial-gradient(700px at 12% 15%, rgba(165,150,218,.18), transparent 60%),
    radial-gradient(600px at 88% 25%, rgba(124,107,196,.14), transparent 60%),
    radial-gradient(500px at 50% 85%, rgba(165,150,218,.10), transparent 60%);
  filter:blur(40px); z-index:-1; animation:float 25s ease-in-out infinite alternate;
}
@keyframes float{to{transform:translateY(-20px) scale(1.03)}}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.6px}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 24px rgba(165,150,218,.45), inset 0 1px 0 rgba(255,255,255,.2);display:grid;place-items:center;color:#0b0714;font-weight:900;font-size:13px}
.tabs{display:flex;gap:6px;flex:1;overflow:auto;padding:2px}
.tab{padding:8px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.4px;cursor:pointer;white-space:nowrap;transition:.18s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.active{color:var(--text);background:rgba(165,150,218,.14);border-color:rgba(165,150,218,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(165,150,218,.08) inset}
.connect{display:flex;gap:8px;align-items:center}
.connect input{width:200px;background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:10px;font-size:13px;outline:none}
.connect input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(165,150,218,.18)}
.btn{padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#0e0a18;box-shadow:0 8px 22px rgba(165,150,218,.28)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.28);color:#fecaca}
.btn.danger:hover{background:rgba(248,113,113,.2)}
.workspace{display:grid;grid-template-columns:330px 1fr;gap:14px;padding:14px;flex:1;min-height:0}
.sidebar{border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;border-bottom:1px solid var(--border)}
.side-head h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:800}
.list{overflow:auto;padding:10px;flex:1;display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:11px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;align-items:center;transition:.15s;background:rgba(0,0,0,.18)}
.item:hover{background:rgba(255,255,255,.05);border-color:var(--border)}
.item.active{background:rgba(165,150,218,.12);border-color:rgba(165,150,218,.3)}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#0d0d14;flex-shrink:0;display:grid;place-items:center;font-size:22px;border:1px solid var(--border);overflow:hidden}
.meta{min-width:0;flex:1}
.meta .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(165,150,218,.15);color:var(--accent);border:1px solid rgba(165,150,218,.25);text-transform:uppercase;letter-spacing:.3px}
.badge.friend{background:rgba(52,211,153,.15);color:#6ee7b7;border-color:rgba(52,211,153,.25)}
.badge.collab{background:rgba(251,191,36,.15);color:#fcd34d;border-color:rgba(251,191,36,.25)}
.editor{border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ed-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.ed-head .title{font-weight:800;font-size:15px;letter-spacing:.3px}
.ed-actions{display:flex;gap:8px}
.ed-body{overflow:auto;padding:18px;flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
input[type="text"],input[type="number"],input[type="date"],input[type="password"],select,textarea{
  background:rgba(0,0,0,.32);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:10px;font-size:14px;outline:none;transition:.18s;width:100%;font-family:inherit
}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(165,150,218,.16)}
.color-row{display:flex;gap:10px;align-items:center}
input[type="color"]{width:44px;height:38px;padding:0;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:22px;background:rgba(255,255,255,.12);border-radius:999px;position:relative;border:1px solid var(--border);transition:.2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:white;transition:.2s}
.switch input:checked{background:rgba(165,150,218,.5);border-color:var(--accent)}
.switch input:checked::after{left:18px;background:#0e0a18}
.blocks{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.block{background:var(--glass-2);border:1px solid var(--border);border-radius:14px;padding:12px}
.block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.block-type{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);text-transform:uppercase}
.block-ctrls{display:flex;gap:6px}
.icon{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--border);cursor:pointer;font-size:14px;transition:.15s}
.icon:hover{background:rgba(255,255,255,.12)}
.divider-prev{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:8px 0;border-radius:2px}
.img-prev{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--border);cursor:zoom-in;display:block}
.upload{display:flex;gap:8px;align-items:center}
.upload input[type="file"]{display:none}
.file-btn{padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.06);border:1px dashed var(--border-2);cursor:pointer;font-size:12.5px;font-weight:700}
.file-btn:hover{background:rgba(255,255,255,.1)}
.tracks{display:flex;flex-direction:column;gap:8px}
.track{display:grid;grid-template-columns:1fr 90px 110px 130px 32px;gap:8px;align-items:center;background:rgba(0,0,0,.22);padding:8px;border-radius:10px;border:1px solid var(--border)}
.track .icon{width:30px;height:32px}
.links-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:12px;text-align:center;padding:40px}
.empty .big{font-size:42px;opacity:.7}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:rgba(0,0,0,.4);gap:10px}
.status-msg{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.5)}
.dot.err{background:var(--red)}
.dot.work{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px);padding:20px}
.modal.show{display:flex}
.modal img{max-width:92vw;max-height:88vh;border-radius:12px;border:1px solid var(--border)}
.alert{padding:10px 12px;border-radius:10px;font-size:13px;border:1px solid;margin-bottom:12px}
.alert.warn{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:#fde68a}
.audio{width:100%;margin-top:8px;background:rgba(0,0,0,.3);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);font-size:12px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.1)}
.sep{height:1px;background:var(--border);margin:14px 0}
@media (max-width:980px){
  .workspace{grid-template-columns:1fr; padding:10px}
  .sidebar{max-height:38vh}
  .form{grid-template-columns:1fr}
  .links-grid{grid-template-columns:1fr}
  .track{grid-template-columns:1fr 80px 100px 32px}
  .track select:nth-child(3){display:none}
  .connect input{width:140px}
  .topbar{flex-wrap:wrap}
  .tabs{order:3;width:100%}
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(165,150,218,.25);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(165,150,218,.4);background-clip:padding-box}
</style>
</head>
<body>
<div class="app">
  <header class="topbar glass">
    <div class="brand"><div class="logo">DZ</div><span>DENNIS CMS</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="blog">BLOG</button>
      <button class="tab" data-tab="songs">SONGS</button>
      <button class="tab" data-tab="people">PEOPLE</button>
      <button class="tab" data-tab="categories">CATEGORIES</button>
      <button class="tab" data-tab="albums">ALBUMS</button>
    </nav>
    <div class="connect">
      <input id="token" type="password" placeholder="GitHub token (ghp_...)" autocomplete="off">
      <button id="btnConnect" class="btn primary">Connect</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar glass">
      <div class="side-head">
        <h2 id="listTitle">Blog Posts</h2>
        <button id="btnNew" class="btn small">+ New</button>
      </div>
      <div id="list" class="list"></div>
    </aside>

    <main class="editor glass" id="editor">
      <div class="empty">
        <div class="big">✦</div>
        <div><b>Connect to GitHub</b><br><span class="hint">Enter token → Connect → select an item</span></div>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <div class="status-msg"><span class="dot" id="dot"></span><span id="status">Not connected</span></div>
    <div>denniszerovt/denniszerovt.github.io @ main</div>
  </footer>
</div>

<div id="modal" class="modal" onclick="this.classList.remove('show')"><img id="modalImg" alt=""></div>

<script>
const REPO = 'denniszerovt/denniszerovt.github.io';
const BRANCH = 'main';
const OWNER = 'denniszerovt';

// Content constants (SITE_SONGS, SITE_PEOPLE, etc.) now live in app.js, not
// index.html — index.html/music.html/blog.html/etc. are just markup that
// includes <script src="app.js">. The variable's still called INDEX_PATH
// for the rest of this file's naming; it just points somewhere else now.
const INDEX_PATH = 'app.js';

// index.html itself (the actual markup file) — used only to bump a cache-busting
// query param on the <script src="app.js"> tag after every save, so GitHub Pages
// visitors (and the browser's own cache) always pick up the freshly-saved data
// instead of serving a stale cached copy of app.js.
const SITE_HTML_PATH = 'index.html';

const UPLOADS = {
  posts: 'images/posts/',
  songs: 'SongData/Songs/',
  covers: 'SongData/AlbumArt/',
  people: 'Friends/'
};

const FALLBACK_CATEGORIES = [
  {"id":"game-dev","name":"Game Dev","color":"#A596DA","subs":["Snowfall","Stuck In Time","Other Projects"]},
  {"id":"music-production","name":"Music Production","color":"#ec4899","subs":["Snowfall","Originals","Remixes","Soundtracks","Behind the Beat"]},
  {"id":"daily-life","name":"Daily Life","color":"#22c55e","subs":["Workflow","Thoughts","Updates","Gear"]}
];
const FALLBACK_POSTS = [
  { id:"welcome-2025", title:"Welcome to the new CMS", category:"Daily Life", subcategory:"Update", date:"2025-01-15", color:"#A596DA", blocks:[{type:"text",content:"This is a glassmorphism CMS synced directly to GitHub. Write with blocks, upload images, and publish instantly."},{type:"divider"},{type:"text",content:"Legacy posts with body/images are auto-converted."}]} 
];

  {
    id:"snowfall", title:"Snowfall", artist:"DennisZeroVT", year:2025, coverEmoji:"❄️",
    cover:"https://denniszerovt.github.io/SongData/AlbumArt/snowfall.png",
    audio:"https://denniszerovt.github.io/SongData/Songs/snowfall.mp3",
    badges:["Lo-fi","Collab","Winter Vibes"],
    streaming:{ spotify:"https://open.spotify.com/", apple:"https://music.apple.com/", tidal:"", youtube:"https://youtube.com/", amazon:"", deezer:"" },
    about:"Snowfall was created during a late winter night with Erik on vocals and inspired by Viona's calming presence. It's about that quiet moment when the world slows down.",

  },
  {

    cover:"https://denniszerovt.github.io/SongData/AlbumArt/stuck-in-time.png",
    audio:"https://denniszerovt.github.io/SongData/Songs/stuck-in-time.mp3",
    badges:["Drum & Bass","Collab"],

    behindTheScenes:"Kula absolutely killed the drums on this. He sent me the stems at 3am and I knew instantly it was perfect. We built the entire drop around his groove."
  }
];
const FALLBACK_PEOPLE = [
  { id:"erik",   name:"Erik",   handle:"eri_k416",       role:"Friend // eri_k416",         avatar:"https://denniszerovt.github.io/Friends/erik.jpg",   bio:"Erik was the subject and inspiration for Snowfall.",  tags:["friend","collab"], links:{twitter:"",spotify:"",instagram:"",website:""}, credits:[{song:"Snowfall",       songId:"snowfall",     role:"Inspiration", note:"His character Viona shaped the whole mood"}],                                         color:"from-blue-500/30 to-blue-600/10",   icon:"fas fa-snowflake", showOnHome:true },
  { id:"kula",   name:"Kula",   handle:"@mee_yawwwwww",  role:"Friend, Drummer // @mee_yawwwwww", avatar:"https://denniszerovt.github.io/Friends/kula.jpg", bio:"Kula is a musician and drummer I met during an idol group project.", tags:["friend","collab"], links:{twitter:"",spotify:"",instagram:"",website:""}, credits:[{song:"Stuck In Time", songId:"stuck_in_time", role:"Drums",        note:"Recorded live drums; killed the half-time section"}], color:"from-[#A596DA]/30 to-[#8B78CB]/10", icon:"fas fa-drum",      showOnHome:true },
  { id:"vivid",  name:"Vivid",  handle:"@vivid_exile",   role:"Best Friend // @vivid_exile", avatar:"https://denniszerovt.github.io/Friends/vivid.jpg",  bio:"An ex-military veteran I met in my very first Discord server.", tags:["friend"], links:{}, credits:[], color:"from-pink-500/30 to-pink-600/10",   icon:"fas fa-guitar",    showOnHome:true },
  { id:"skylar", name:"Skylar", handle:"@skylar_corgi",  role:"Friend // @skylar_corgi",     avatar:"https://denniszerovt.github.io/Friends/skylar.jpg", bio:"Skylar is a best friend I met through Vivid.",        tags:["friend"], links:{}, credits:[], color:"from-purple-500/30 to-purple-600/10", icon:"fas fa-guitar",    showOnHome:true },
  { id:"nox",    name:"Nox",    handle:"@Nox_Daemon",    role:"Friend // @Nox_Daemon",       avatar:"https://denniszerovt.github.io/Friends/nox.jpg",    bio:"Nox is a friend I met through Vivid.",                tags:["friend"], links:{}, credits:[], color:"from-blue-500/30 to-blue-600/10",   icon:"fas fa-guitar",    showOnHome:true }
];
const FALLBACK_ALBUMS = [
  { id:"solo-ep", name:"Solo EP", artist:"DennisZeroVT", year:2025, cover:"https://denniszerovt.github.io/SongData/AlbumArt/solo-ep.png", status:"Released", description:"My first solo collection.", tracklist:[{name:"Snowfall",duration:"3:24",status:"released",key:"snowfall"},{name:"Stuck In Time",duration:"4:11",status:"released",key:"stuck-in-time"},{name:"Midnight Drive",duration:"2:58",status:"planned",key:""}] }
];

const state = {
  token: localStorage.getItem('dzcms_token')||'',
  connected:false,
  shas:{},
  data:{ posts:[], songs:[], people:[], albums:[], categories:[] },
  tab:'blog',
  currentId:null,
  dirty:false
};

const $ = s=>document.querySelector(s);
const listEl = $('#list');
const editorEl = $('#editor');
const statusEl = $('#status');
const dotEl = $('#dot');
const listTitle = $('#listTitle');

function setStatus(msg, type=''){
  statusEl.textContent = msg;
  dotEl.className = 'dot ' + (type==='ok'?'ok':type==='err'?'err':type==='work'?'work':'');
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))) }
function b64dec(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))) }
function today(){ return new Date().toISOString().slice(0,10) }
function ghUrl(path){ return `https://${OWNER}.github.io/${path}` }

async function ghFetch(path, opts={}){
  const url = `https://api.github.com/repos/${REPO}/contents/${path}${opts.ref?`?ref=${opts.ref}`:''}`;
  const res = await fetch(url, {
    ...opts,
    headers:{ 'Authorization':`token ${state.token}`, 'Accept':'application/vnd.github.v3+json', ...opts.headers }
  });
  if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}
/* ---------------------------------------------------------------------------
   index.html-backed storage. There's no more data/*.json — everything
   (SITE_SONGS, SITE_PEOPLE, SITE_ALBUMS, SITE_CATEGORIES, SITE_POSTS) lives
   as hardcoded JS constants inside index.html's <script>. These helpers
   read the whole file, pull out one constant's literal value by scanning
   for its balanced [...] / {...}, and splice an edited value back in as
   JSON (which is also valid JS, so it stays a working constant).
   --------------------------------------------------------------------------- */

async function getSiteHtml(){
  const data = await ghFetch(INDEX_PATH, {ref:BRANCH});
  state.shas[INDEX_PATH] = data.sha;
  return b64dec(data.content);
}

async function putSiteHtml(html, message){
  const content = b64enc(html);
  const body = { message, content, branch:BRANCH, sha:state.shas[INDEX_PATH] };
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${INDEX_PATH}`,{
    method:'PUT',
    headers:{ 'Authorization':`token ${state.token}`, 'Content-Type':'application/json' },
    body:JSON.stringify(body)
  });
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.message||res.statusText) }
  const data = await res.json();
  state.shas[INDEX_PATH] = data.content.sha;
  return data;
}

// Finds `const NAME = <literal>;` in html and returns the parsed value plus
// the exact [start,end) character range of just the literal (so callers can
// splice a replacement in without touching anything else in the file).
function locateConst(html, name){
  const marker = `const ${name} = `;
  const markerStart = html.indexOf(marker);
  if(markerStart === -1) throw new Error(`Could not find "const ${name}" in index.html`);
  const litStart = markerStart + marker.length;
  const openChar = html[litStart];
  const closeChar = openChar === '[' ? ']' : '}';
  if(openChar !== '[' && openChar !== '{') throw new Error(`Unexpected literal start for ${name}`);
  let depth = 0, inStr = null, i = litStart;
  for(; i < html.length; i++){
    const c = html[i];
    if(inStr){
      if(c === '\\'){ i++; continue; }
      if(c === inStr) inStr = null;
      continue;
    }
    if(c === '"' || c === "'" || c === '`'){ inStr = c; continue; }
    if(c === openChar) depth++;
    else if(c === closeChar){
      depth--;
      if(depth === 0){ i++; break; }
    }
  }
  if(depth !== 0) throw new Error(`Unbalanced literal while parsing ${name}`);
  const literalText = html.slice(litStart, i);
  const value = new Function('return (' + literalText + ')')();
  return { value, start: litStart, end: i };
}

function extractConst(html, name){
  return locateConst(html, name).value;
}

function replaceConst(html, name, newValue){
  const { start, end } = locateConst(html, name);
  const serialized = JSON.stringify(newValue, null, 2);
  return html.slice(0, start) + serialized + html.slice(end);
}

// Save one constant's array/object back into index.html on GitHub.
// Always re-fetches the file fresh right before writing so saving several
// sections back-to-back in one session never hits a stale-sha conflict.
async function saveDataBlock(constName, value, message){
  const html = await getSiteHtml();
  const updated = replaceConst(html, constName, value);
  await putSiteHtml(updated, message);
  await patchStaticIndexHtml({ bustCache: true, songs: constName === 'SITE_SONGS' ? value : null });
}

// Builds the exact same card markup app.js renders into #songs-grid, but as
// a plain string committed straight into index.html — real static HTML, not
// hidden metadata. Every song gets a stable id="song-<id>" anchor.
function buildStaticSongCardsHtml(songs){
  const list = (songs || []).filter(s => s && s.title);
  if(!list.length){
    return '<p style="color:var(--text-secondary,#9d94b8);padding:2rem;text-align:center;grid-column:1/-1">No songs yet.</p>';
  }
  return list.map(s => {
    const badges = (s.badges || []).slice(0, 3).map(b => {
      const label = typeof b === 'string' ? b : (b.label || '');
      const color = (b && typeof b === 'object' && b.color) || null;
      return color
        ? `<span class="text-[10px] px-2 py-0.5 rounded-full" style="background:${color};color:#fff">${esc(label)}</span>`
        : `<span class="text-[10px] px-2 py-0.5 rounded-full bg-white/10 text-white/70">${esc(label)}</span>`;
    }).join('');
    const genreChips = (s.genres || []).map(g => `<span class="song-genre-chip">${esc(g)}</span>`).join('');
    const cover = s.cover || '';
    const emoji = esc(s.coverEmoji || '🎵');
    return `    <div id="song-${esc(s.id)}" class="group relative glass rounded-2xl overflow-hidden cursor-pointer glow-hover transition-all duration-300 hover:-translate-y-1" onclick="openSong('${esc(s.id)}')">
        <div class="aspect-square relative overflow-hidden bg-gradient-to-br from-[#1a1a1a] to-[#0a0a0a]">
            ${s.year ? `<span class="song-year-badge">${esc(String(s.year))}</span>` : ''}
            ${cover ? `<img src="${esc(cover)}" alt="${esc(s.title)}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.style.display='none'">` : ''}
            <div class="absolute inset-0 flex items-center justify-center text-5xl opacity-20">${emoji}</div>
            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center z-[1]">
                <div class="w-14 h-14 rounded-full bg-[#A596DA] flex items-center justify-center shadow-lg scale-90 group-hover:scale-100 transition-transform">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
        </div>
        <div class="p-4">
            <h3 class="font-semibold text-white truncate">${esc(s.title)}</h3>
            <p class="text-sm text-[var(--text-secondary)] mt-1">${esc(s.artist || '')}</p>
            ${genreChips ? `<div class="flex gap-1.5 mt-2 flex-wrap">${genreChips}</div>` : ''}
            <div class="flex gap-1.5 mt-3 flex-wrap">${badges}</div>
        </div>
    </div>`;
  }).join('\n\n');
}

// Patches the real index.html (not app.js) in one combined commit:
//  1. Bumps ?v=<timestamp> on the <script src="app.js"> tag so browsers/GitHub
//     Pages never serve a stale cached copy after a save (this is why edits can
//     otherwise look like they "didn't take" even though the commit succeeded).
//  2. If songs are passed, regenerates the REAL static song cards between the
//     <!-- STATIC_SONGS_START/END --> markers inside #songs-grid. This is plain,
//     visible HTML baked right into the page source — not a hidden metadata
//     block — so any crawler, JS or not, sees the actual song titles, artists,
//     genres, years and status badges immediately, with no JS required. Once
//     app.js loads it re-renders the same grid dynamically for search/sort/
//     filter, but this static version is what's there before that happens.
async function patchStaticIndexHtml({ bustCache = true, songs = null } = {}){
  try{
    const info = await ghFetch(SITE_HTML_PATH, {ref:BRANCH});
    let html = b64dec(info.content);
    let changed = false;

    if(bustCache){
      const v = Date.now();
      const scriptRe = /<script\s+src=["']app\.js(?:\?v=\d+)?["']\s*><\/script>/;
      if(scriptRe.test(html)){ html = html.replace(scriptRe, `<script src="app.js?v=${v}"><\/script>`); changed = true; }
      else console.warn('Cache-bust skipped: could not find <script src="app.js"> in index.html');
    }

    if(songs){
      const cardsHtml = buildStaticSongCardsHtml(songs);
      const staticRe = /(<!-- STATIC_SONGS_START -->)([\s\S]*?)(<!-- STATIC_SONGS_END -->)/;
      if(staticRe.test(html)){ html = html.replace(staticRe, `$1\n${cardsHtml}\n$3`); changed = true; }
      else console.warn('STATIC_SONGS markers not found in index.html; skipping static song sync');
    }

    if(!changed) return;

    const content = b64enc(html);
    const body = { message: songs ? 'cms: sync static song cards + bust cache' : 'cms: bust app.js cache', content, branch: BRANCH, sha: info.sha };
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${SITE_HTML_PATH}`,{
      method:'PUT',
      headers:{ 'Authorization':`token ${state.token}`, 'Content-Type':'application/json' },
      body:JSON.stringify(body)
    });
    if(!res.ok){ console.warn('index.html patch commit failed:', res.status, res.statusText); }
  }catch(err){
    // Non-fatal — the actual content save above already succeeded either way.
    console.warn('index.html patch skipped:', err.message);
  }
}
async function uploadFile(file, dest){
  const buf = await file.arrayBuffer();
  let binary=''; const bytes=new Uint8Array(buf); for(let i=0;i<bytes.byteLength;i++) binary+=String.fromCharCode(bytes[i]);
  const content = btoa(binary);
  let sha=null;
  try{ const info = await ghFetch(dest,{ref:BRANCH}); sha=info.sha; }catch{}
  const body={message:`upload ${dest}`,content,branch:BRANCH, ...(sha?{sha}:{})};
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${dest}`,{
    method:'PUT', headers:{'Authorization':`token ${state.token}`,'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!res.ok) throw new Error('Upload failed');
  return ghUrl(dest);
}

function migratePosts(posts){
  return posts.map(p=>{
    if(p.blocks) return p;
    const blocks=[];
    if(p.body) blocks.push({type:'text',content:p.body});
    if(Array.isArray(p.images)) p.images.forEach(src=>blocks.push({type:'image',src,caption:''}));
    return {...p, blocks};
  });
}

async function connect(){
  if(!state.token){ alert('Enter GitHub token'); return }
  localStorage.setItem('dzcms_token', state.token);
  setStatus('Connecting to GitHub…','work');
  try{
    const html = await getSiteHtml();
    const posts = extractConst(html, 'SITE_POSTS');
    const songs = extractConst(html, 'SITE_SONGS');
    const people = extractConst(html, 'SITE_PEOPLE');
    const albums = extractConst(html, 'SITE_ALBUMS');
    const categories = extractConst(html, 'SITE_CATEGORIES');
    state.data.posts = migratePosts(posts);
    state.data.songs = songs;
    state.data.people = people;
    state.data.albums = albums;
    state.data.categories = categories;
    state.connected = true;
    setStatus('Connected • Synced','ok');
    render();
  }catch(e){
    console.error(e);
    setStatus('Connection failed: '+e.message,'err');
    // still load fallbacks for offline editing
    state.data.posts = FALLBACK_POSTS;
    state.data.songs = FALLBACK_SONGS;
    state.data.people = FALLBACK_PEOPLE;
    state.data.albums = FALLBACK_ALBUMS;
    state.data.categories = FALLBACK_CATEGORIES;
    render();
  }
}

function render(){
  renderTabs();
  renderList();
  renderEditor();
}
function renderTabs(){

}
function renderList(){
  listEl.innerHTML='';

  const items = [...data].sort((a,b)=>{
    if(state.tab==='blog') return (b.date||'').localeCompare(a.date||'');
    if(state.tab==='songs' || state.tab==='albums') return (b.year||0)-(a.year||0);
    return (a.name||'').localeCompare(b.name||'');
  });
  items.forEach(it=>{
    const div=document.createElement('div');
    div.className='item'+(it.id===state.currentId?' active':'');
    div.onclick=()=>{ state.currentId=it.id; renderList(); renderEditor(); };
    const thumb = document.createElement('div'); thumb.className='thumb';
    if(state.tab==='blog'){
      const firstImg = (it.blocks||[]).find(b=>b.type==='image')?.src;
      if(firstImg){ const img=document.createElement('img'); img.src=firstImg; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; thumb.appendChild(img); } else thumb.textContent='📝';

      if(it.avatar){ const img=document.createElement('img'); img.src=it.avatar; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; thumb.appendChild(img);} else thumb.textContent=it.icon||'👤';
    } else if(state.tab==='categories'){

    } else {
      if(it.cover){ const img=document.createElement('img'); img.src=it.cover; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; thumb.appendChild(img);} else thumb.textContent='💿';
    }
    const meta=document.createElement('div'); meta.className='meta';
    const t=document.createElement('div'); t.className='t'; t.textContent= state.tab==='blog'?it.title:it.name||it.title;
    const s=document.createElement('div'); s.className='s';
    if(state.tab==='blog') s.innerHTML=`<span>${it.category||''}</span> • <span>${it.date||''}</span>`;
    else if(state.tab==='songs') s.innerHTML=`<span>${it.artist||''}</span> • <span>${it.year||''}</span>`;
    else if(state.tab==='people'){ s.innerHTML=''; (it.tags||[]).forEach(tag=>{ const b=document.createElement('span'); b.className='badge '+tag; b.textContent=tag; s.appendChild(b); }); }
    else if(state.tab==='categories'){ s.innerHTML=`<span class="badge" style="background:${it.color}20;color:${it.color};border-color:${it.color}40">${it.id}</span> • <span>${(it.subs||[]).length} subs</span>`; }
    else s.innerHTML=`<span>${it.status||''}</span> • <span>${it.year||''}</span>`;
    meta.appendChild(t); meta.appendChild(s);
    div.appendChild(thumb); div.appendChild(meta);
    listEl.appendChild(div);
  });

function getCurrentArray(){
  return state.tab==='blog'?state.data.posts:state.tab==='songs'?state.data.songs:state.tab==='people'?state.data.people:state.tab==='categories'?state.data.categories:state.data.albums;
}
function getCurrentItem(){
  return getCurrentArray().find(x=>x.id===state.currentId);
}

function renderEditor(){

// --- Shared content-block editor: used by both Blog posts and Song overlays. ---
// Operates on item.blocks (array). Requires the current editor form to contain
// buttons with [data-add="text|image|video|divider"] and a `<div id="blocks">` wrap.
function newBlockOfType(type){
  if(type==='text') return {type:'text', heading:'', content:''};
  if(type==='image') return {type:'image', src:'', caption:''};
  if(type==='video') return {type:'video', src:'', url:'', caption:''};
  return {type:'divider'};
}
function initBlockEditor(item){
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ item.blocks=item.blocks||[]; item.blocks.push(newBlockOfType(b.dataset.add)); renderBlockList(item); });
  renderBlockList(item);
}
function renderBlockList(p){
    const wrap = $('#blocks'); wrap.innerHTML='';
    (p.blocks||[]).forEach((bl,i)=>{
      const d=document.createElement('div'); d.className='block';
      d.innerHTML=`<div class="block-head"><div class="block-type">${bl.type}</div><div class="block-ctrls">
        <div class="icon" title="Up">↑</div><div class="icon" title="Down">↓</div><div class="icon" title="Delete">✕</div></div></div>
        <div class="block-body"></div>`;
      const [up,down,del]=d.querySelectorAll('.icon');
      up.onclick=()=>{ if(i>0){ [p.blocks[i-1],p.blocks[i]]=[p.blocks[i],p.blocks[i-1]]; renderBlockList(p);} };
      down.onclick=()=>{ if(i<p.blocks.length-1){ [p.blocks[i+1],p.blocks[i]]=[p.blocks[i],p.blocks[i+1]]; renderBlockList(p);} };
      del.onclick=()=>{ p.blocks.splice(i,1); renderBlockList(p); };
      const body=d.querySelector('.block-body');
      if(bl.type==='text'){
        body.innerHTML=`
          <input type="text" data-k="heading" placeholder="Section heading (optional — e.g. About, Thoughts, Behind the Scenes)" value="${esc(bl.heading||'')}" style="margin-bottom:8px">
          <textarea data-k="content" placeholder="Write...">${esc(bl.content||'')}</textarea>`;
      }else if(bl.type==='image'){
        body.innerHTML=`
          <div class="upload"><label class="file-btn">Choose image<input type="file" accept="image/*"></label><span class="hint">${bl.src? 'Uploaded':'No file'}</span></div>
          ${bl.src?`<img class="img-prev" src="${bl.src}" alt="">`:''}
          <div style="margin-top:8px"><input type="text" data-k="caption" placeholder="Caption (optional)" value="${esc(bl.caption||'')}"></div>
        `;
        const fileInp=body.querySelector('input[type=file]');
        const img=body.querySelector('img');
        if(img) img.onclick=()=>showImg(bl.src);
        fileInp.onchange=async e=>{
          const f=e.target.files[0]; if(!f) return;
          try{ setStatus('Uploading image…','work'); const url=await uploadFile(f, `${UPLOADS.posts}${Date.now()}-${f.name.replace(/\s+/g,'-')}`); bl.src=url; setStatus('Image uploaded','ok'); renderBlockList(p);}catch(err){ setStatus('Upload failed','err'); alert(err.message) }
        };
      }else if(bl.type==='video'){
        body.innerHTML=`
          <div style="margin-bottom:10px">
            <div class="hint" style="margin-bottom:6px">Option 1 — Upload video file</div>
            <div class="row">
              <label class="field" style="flex:1;gap:4px"><span class="hint" style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px">Quality</span>
                <select id="vq_${i}" style="font-size:12px;padding:6px 8px">
                  <option value="original">Original (no compression)</option>
                  <option value="high" selected>High (1080p cap, good quality)</option>
                  <option value="medium">Medium (720p cap, smaller file)</option>
                  <option value="low">Low (480p cap, smallest file)</option>
                </select>
              </label>
              <label class="file-btn" style="align-self:flex-end;margin-bottom:0">Choose video<input type="file" accept="video/*" id="vfile_${i}"></label>
            </div>
            <div id="vhint_${i}" class="hint" style="margin-top:4px">${bl.src && !bl.url ? '✓ Uploaded' : 'No file selected'}</div>
            ${bl.src && !bl.url ? `<video controls class="audio" src="${bl.src}" style="margin-top:8px;max-height:180px;border-radius:8px"></video>` : ''}
          </div>
          <div style="margin-bottom:10px">
            <div class="hint" style="margin-bottom:6px">Option 2 — Paste a URL (YouTube, Vimeo, direct mp4…)</div>
            <input type="text" data-k="url" placeholder="https://youtube.com/watch?v=… or direct .mp4 URL" value="${esc(bl.url||'')}">
          </div>
          <div><input type="text" data-k="caption" placeholder="Caption (optional)" value="${esc(bl.caption||'')}"></div>
        `;
        const vfileInp = body.querySelector(`#vfile_${i}`);
        const vhint = body.querySelector(`#vhint_${i}`);
        const qualSel = body.querySelector(`#vq_${i}`);
        vfileInp.onchange = async e => {
          const f = e.target.files[0]; if(!f) return;
          const quality = qualSel.value;
          try {
            setStatus('Processing video…','work');
            vhint.textContent = quality === 'original' ? 'Uploading…' : 'Compressing video (this may take a moment)…';
            let fileToUpload = f;
            if(quality !== 'original'){
              fileToUpload = await compressVideo(f, quality);
            }
            const url = await uploadFile(fileToUpload, `${UPLOADS.posts}${Date.now()}-${fileToUpload.name||f.name.replace(/\s+/g,'-')}`);
            bl.src = url; bl.url = '';
            setStatus('Video uploaded','ok');
            renderBlockList(p);
          } catch(err) { setStatus('Upload failed','err'); vhint.textContent = 'Error: '+err.message; }
        };
      }else{
        body.innerHTML=`<div class="divider-prev"></div><span class="hint">Visual separator</span>`;
      }
      body.querySelectorAll('[data-k]').forEach(inp=>{ inp.oninput=()=>{ bl[inp.dataset.k]=inp.value } });
      wrap.appendChild(d);
    });
}
async function saveBlog(){
  const p=getCurrentItem(); if(!p) return;
  p.title=$('#f_title').value.trim()||'Untitled';
  p.date=$('#f_date').value||today();
  p.category=$('#f_cat').value;
  p.subcategory=$('#f_sub').value;
  p.color=$('#f_color').value;
  p.id = p.id || slugify(p.title+'-'+p.date);
  try{
    setStatus('Saving post…','work');
    const arr=state.data.posts; const idx=arr.findIndex(x=>x.id===p.id); if(idx>=0) arr[idx]=p; else arr.push(p);
    await saveDataBlock('SITE_POSTS', arr, `blog: ${p.title}`);
    setStatus('Post saved','ok'); renderList();
  }catch(e){ setStatus('Save failed','err'); alert(e.message) }
}
async function deleteBlog(){
  const p=getCurrentItem(); if(!p) return; if(!confirm('Delete this post?')) return;
  try{
    setStatus('Deleting…','work');
    state.data.posts = state.data.posts.filter(x=>x.id!==p.id);
    await saveDataBlock('SITE_POSTS', state.data.posts, `delete post: ${p.title}`);
    state.currentId=null; setStatus('Deleted','ok'); render();
  }catch(e){ setStatus('Delete failed','err'); alert(e.message) }
}

  s.status = s.status || 'Released';
  function syncStatusBadge(){
    const statusLabels = STATUS_OPTIONS.map(o => o.label.toLowerCase());
    s.badges = (s.badges || []).filter(b => !statusLabels.includes((b.label || '').toLowerCase()));
    const opt = STATUS_OPTIONS.find(o => o.label === s.status);

  function renderStatusPills(){
    const wrap = $('#status_pills'); wrap.innerHTML = '';

      btn.onclick = () => { s.status = opt.label; syncStatusBadge(); renderStatusPills(); renderBadges(); };
      wrap.appendChild(btn);
    });

  renderStatusPills();

  // --- Badge editor with color ---
  const defaultColors = { 'Released':'#10B981','pending':'#6B7280','Pending':'#6B7280','Spotify':'#1DB954','Apple Music':'#FA243C','Tidal':'#000000','Amazon':'#FF9900','YouTube Music':'#FF0000','Deezer':'#FEAA2D' };
  s.badges = (s.badges||[]).map(b => typeof b==='string' ? {label:b, color: defaultColors[b]||'#A596DA'} : {label:b.label||'', color:b.color||'#A596DA'});

      `;
      badgeWrap.appendChild(row);
    });
    badgeWrap.querySelectorAll('[data-k]').forEach(inp=>{
      inp.oninput=e=>{
        const i=+e.target.dataset.i; const k=e.target.dataset.k;
        s.badges[i][k]=e.target.value;
        const prev = e.target.parentElement.querySelector('.preview');
        if(prev){ prev.textContent=s.badges[i].label; prev.style.background=s.badges[i].color; }
      };
    });
    badgeWrap.querySelectorAll('[data-del]').forEach(btn=>{ btn.onclick=()=>{ s.badges.splice(+btn.dataset.del,1); renderBadges(); } });
  }
  $('#add_badge').onclick=()=>{ s.badges.push({label:'New', color:'#A596DA'}); renderBadges(); };
  renderBadges();

  // --- Genre tag editor ---
  s.genres = Array.isArray(s.genres) ? s.genres.slice() : [];
  const genreWrap = $('#genre_editor');
  function renderGenres(){
    genreWrap.innerHTML = '';

      chip.style = 'display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(165,150,218,.18);border:1px solid rgba(165,150,218,.4);color:#C4B5FD;font-size:12px;margin:0 6px 6px 0';

      genreWrap.appendChild(chip);
    });
    genreWrap.querySelectorAll('[data-del]').forEach(btn=>{ btn.onclick=()=>{ s.genres.splice(+btn.dataset.del,1); renderGenres(); }; });
  }
  function addGenre(){
    const inp = $('#genre_input');
    const val = (inp.value||'').trim();
    if(val && !s.genres.includes(val)){ s.genres.push(val); renderGenres(); }
    inp.value='';
  }
  $('#add_genre').onclick=addGenre;
  $('#genre_input').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addGenre(); } });
  renderGenres();

  // --- Credits editor: role + name, optionally linked to a real person ---
  s.credits = Array.isArray(s.credits) ? s.credits.slice() : [];
  const creditsWrap = $('#credits_editor');
  const peopleList = state.data.people || [];
  function renderCredits(){
    creditsWrap.innerHTML = '';
    s.credits.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.style = 'gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap';
      const personOptions = peopleList.map(p =>
        `<option value="${esc(p.id)}" ${c.personId===p.id?'selected':''}>${esc(p.name)}</option>`
      ).join('');
      row.innerHTML = `
        <input data-i="${i}" data-k="role" list="credit_role_options" value="${esc(c.role||'')}" placeholder="Role (e.g. Drums, Mixing Engineer)" style="flex:1;min-width:160px">
        <select data-i="${i}" data-k="personId" style="min-width:170px">
          <option value="">— Not linked (plain text) —</option>
          ${personOptions}
        </select>
        <input data-i="${i}" data-k="name" value="${esc(c.name||'')}" placeholder="Display name" style="flex:1;min-width:140px">
        <button class="btn small danger" data-del="${i}" type="button">✕</button>
      `;
      creditsWrap.appendChild(row);
    });
    creditsWrap.querySelectorAll('[data-k="role"], [data-k="name"]').forEach(inp => {
      inp.oninput = e => { s.credits[+e.target.dataset.i][e.target.dataset.k] = e.target.value; };
    });
    creditsWrap.querySelectorAll('[data-k="personId"]').forEach(sel => {
      sel.onchange = e => {
        const i = +e.target.dataset.i;
        const pid = e.target.value;
        s.credits[i].personId = pid || null;
        if (pid) {
          const person = peopleList.find(p => p.id === pid);
          if (person) s.credits[i].name = person.name; // auto-fill display name, still editable
        }
        renderCredits();
      };
    });
    creditsWrap.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = () => { s.credits.splice(+btn.dataset.del, 1); renderCredits(); };
    });
  }
  $('#add_credit').onclick = () => { s.credits.push({ role: '', name: '', personId: null }); renderCredits(); };
  renderCredits();

  // --- Content blocks editor (About/Thoughts/Behind/media, freeform) ---
  s.blocks = Array.isArray(s.blocks) ? s.blocks : [];
  initBlockEditor(s);

  $('#s_coverfile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ setStatus('Uploading cover…','work'); const url=await uploadFile(f, `${UPLOADS.covers}${Date.now()}-${f.name.replace(/\s+/g,'-')}`); $('#s_cover').value=url; setStatus('Cover uploaded','ok'); }catch(err){ setStatus('Upload failed','err') } };
  $('#s_audiofile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ setStatus('Uploading audio…','work'); const url=await uploadFile(f, `${UPLOADS.songs}${Date.now()}-${f.name.replace(/\s+/g,'-')}`); $('#s_audio').value=url; setStatus('Audio uploaded','ok'); }catch(err){ setStatus('Upload failed','err') } };
}
async function saveSong(){
  const s=getCurrentItem(); if(!s) return;
  s.title=$('#s_title').value.trim(); s.artist=$('#s_artist').value.trim(); s.year=parseInt($('#s_year').value)||new Date().getFullYear();
  s.coverEmoji=$('#s_emoji').value.trim(); 
  s.genres = Array.isArray(s.genres) ? s.genres.filter(Boolean) : [];
  // badges are maintained as objects by the badge editor
  s.badges=(s.badges||[]).map(b=>({label:(b.label||'').trim(), color:b.color||'#A596DA'})).filter(b=>b.label);
  s.cover=$('#s_cover').value.trim(); s.audio=$('#s_audio').value.trim();
  s.streaming={ spotify:$('#s_spotify').value, apple:$('#s_apple').value, tidal:$('#s_tidal').value, youtube:$('#s_youtube').value, amazon:$('#s_amazon').value, deezer:$('#s_deezer').value };

  s.credits = (s.credits||[]).map(c=>({ role:(c.role||'').trim(), name:(c.name||'').trim(), personId:c.personId||null })).filter(c=>c.role || c.name);
  s.id = s.id || slugify(s.title);

}

async function savePerson(){
  const p = getCurrentItem(); if (!p) return;
  p.name    = $('#p_name').value.trim();
  p.handle  = $('#p_handle').value.trim();
  p.role    = $('#p_role').value.trim();
  p.icon    = $('#p_icon').value.trim();
  p.avatar  = $('#p_avatar').value.trim();
  p.bio     = $('#p_bio').value;
  p.color   = $('#p_color').value.trim();
  p.tags    = [];
  if ($('#p_friend').checked) p.tags.push('friend');
  if ($('#p_collab').checked) p.tags.push('collab');
  p.showOnHome = $('#p_home').checked;
  // credits are mutated live; just ensure the field exists
  p.credits = p.credits || [];
  // keep legacy projects field in sync for any old code that reads it
  p.projects = p.credits.map(c => c.song).filter(Boolean);
  p.links = {
    twitter:   $('#p_twitter').value,
    spotify:   $('#p_spotify').value,
    instagram: $('#p_instagram').value,
    website:   $('#p_website').value
  };
  p.id = p.id || slugify(p.name);
  try {
    setStatus('Saving person…','work');
    const arr = state.data.people;
    const i = arr.findIndex(x => x.id === p.id);
    if (i >= 0) arr[i] = p; else arr.push(p);
    await saveDataBlock('SITE_PEOPLE', arr, `person: ${p.name}`);
    setStatus('Person saved','ok');
    renderList();
  } catch(e) { setStatus('Save failed','err'); alert(e.message); }
}

    <div class="field"><label>Name</label><input type="text" id="cat_name" value="${esc(item.name||'')}"></div>
    <div class="field"><label>Color</label><div class="color-row"><input type="color" id="cat_colorpick" value="${item.color||'#A596DA'}"><input type="text" id="cat_colortext" value="${item.color||'#A596DA'}"></div></div>
    <div class="field"><label>Preview</label><div style="padding:10px;background:rgba(0,0,0,.3);border-radius:8px"><span class="badge" id="catPrev" style="background:${(item.color||'#A596DA')}20;color:${item.color||'#A596DA'};border-color:${(item.color||'#A596DA')}40">${esc(item.name||'')}</span></div></div>
    <div class="field full"><label>Subcategories</label><div id="subsList" class="chips" style="min-height:42px;padding:8px;background:rgba(0,0,0,.2);border-radius:8px;border:1px solid var(--border)"></div><div class="row" style="margin-top:8px"><input type="text" id="newSub" placeholder="Add subcategory..." style="flex:1"><button class="btn small" id="btnAddSub">+ Add</button></div></div>
  `;
  body.appendChild(wrap);

  const idInp = document.getElementById('cat_id');
  const nameInp = document.getElementById('cat_name');
  const colorPick = document.getElementById('cat_colorpick');
  const colorText = document.getElementById('cat_colortext');
  const prev = document.getElementById('catPrev');

  function syncColor(c){ item.color=c; colorPick.value=c; colorText.value=c; prev.style.background=c+'20'; prev.style.color=c; prev.style.borderColor=c+'40'; state.dirty=true; }

  idInp.oninput = ()=>{ item.id=idInp.value.toLowerCase().replace(/[^a-z0-9-]/g,'-'); state.dirty=true; };
  nameInp.oninput = ()=>{ item.name=nameInp.value; prev.textContent=nameInp.value; state.dirty=true; };
  colorPick.oninput = ()=>syncColor(colorPick.value);
  colorText.oninput = ()=>{ if(/^#[0-9a-fA-F]{6}$/.test(colorText.value)) syncColor(colorText.value); };

  renderSubs();
  document.getElementById('btnAddSub').onclick = addCategorySub;
  document.getElementById('newSub').addEventListener('keydown', e=>{ if(e.key==='Enter'){ addCategorySub(); e.preventDefault(); }});
}
function renderSubs(){
  const item = getCurrentItem(); const box = document.getElementById('subsList'); if(!box||!item) return;
  box.innerHTML = (item.subs||[]).map((s,i)=>`<span class="chip" data-sub="${i}">${esc(s)} ×</span>`).join('') || '<span class="hint">No subs yet</span>';
  box.querySelectorAll('.chip').forEach(chip=>chip.onclick=()=>removeCategorySub(parseInt(chip.dataset.sub)));
}
function addCategorySub(){ const item=getCurrentItem(); const inp=document.getElementById('newSub'); const v=inp.value.trim(); if(!v||!item) return; item.subs=item.subs||[]; item.subs.push(v); inp.value=''; state.dirty=true; renderSubs(); renderList(); }
function removeCategorySub(i){ const item=getCurrentItem(); if(!item) return; item.subs.splice(i,1); state.dirty=true; renderSubs(); renderList(); }
async function saveCategories(){ try{ setStatus('Saving categories.json…','work'); await saveDataBlock('SITE_CATEGORIES', state.data.categories, 'cms: update categories'); setStatus('Categories saved ✓','ok'); state.dirty=false; }catch(e){ setStatus('Save failed: '+e.message,'err'); } }
async function deleteCategoryItem(){ const item=getCurrentItem(); if(!item||!confirm('Delete category "'+item.name+'"?')) return; try{ setStatus('Deleting…','work'); state.data.categories=state.data.categories.filter(x=>x.id!==item.id); await saveDataBlock('SITE_CATEGORIES', state.data.categories, `delete category: ${item.name}`); state.currentId=null; setStatus('Deleted','ok'); render(); }catch(e){ setStatus('Delete failed','err'); } }

function renderAlbumEditor(a){
  const body = editorShell('Edit Album', saveAlbum, deleteAlbum);
  body.innerHTML=`
    <div class="form">
      <div class="field"><label>Name</label><input id="a_name" value="${esc(a.name||'')}"></div>
      <div class="field"><label>Artist</label><input id="a_artist" value="${esc(a.artist||'DennisZeroVT')}"></div>
      <div class="field"><label>Year</label><input id="a_year" type="number" value="${a.year||new Date().getFullYear()}"></div>
      <div class="field"><label>Status</label><select id="a_status">${['In Progress','Released','Planned'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field full"><label>Cover</label>
        <div class="upload"><label class="file-btn">Upload cover<input type="file" accept="image/*" id="a_coverfile"></label></div>
        ${a.cover?`<img class="img-prev" src="${a.cover}" onclick="showImg('${a.cover}')">`:''}
        <input id="a_cover" type="text" value="${esc(a.cover||'')}" placeholder="Cover URL" style="margin-top:8px">
      </div>
      <div class="field full"><label>Description</label><textarea id="a_desc">${esc(a.description||'')}</textarea></div>
      <div class="field full">
        <label>Tracklist</label>
        <div class="tracks" id="tracks"></div>
        <button class="btn small" id="addTrack" style="margin-top:8px">+ Add Track</button>
      </div>
    </div>
  `;
  $('#a_coverfile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ setStatus('Uploading…','work'); const url=await uploadFile(f, `${UPLOADS.covers}${Date.now()}-${f.name.replace(/\s+/g,'-')}`); $('#a_cover').value=url; setStatus('Uploaded','ok'); }catch{ setStatus('Upload failed','err') } };
  const tracksWrap=$('#tracks');
  function renderTracks(){
    tracksWrap.innerHTML='';
    (a.tracklist||[]).forEach((t,i)=>{
      const row=document.createElement('div'); row.className='track';
      row.innerHTML=`
        <input value="${esc(t.name||'')}" placeholder="Track name" data-k="name">
        <input value="${esc(t.duration||'')}" placeholder="3:24" data-k="duration">
        <select data-k="status">${['planned','in-progress','released'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>
        <select data-k="key"><option value="">— link song —</option>${state.data.songs.map(s=>`<option value="${s.id}" ${t.key===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
        <div class="icon" title="Delete">✕</div>
      `;
      row.querySelectorAll('[data-k]').forEach(inp=>inp.oninput=()=>t[inp.dataset.k]=inp.value);
      row.querySelector('.icon').onclick=()=>{ a.tracklist.splice(i,1); renderTracks(); };
      tracksWrap.appendChild(row);
    });
  }
  a.tracklist = a.tracklist||[];
  renderTracks();
  $('#addTrack').onclick=()=>{ a.tracklist.push({name:'',duration:'',status:'planned',key:''}); renderTracks(); };
}
async function saveAlbum(){
  const a=getCurrentItem(); if(!a) return;
  a.name=$('#a_name').value.trim(); a.artist=$('#a_artist').value.trim(); a.year=parseInt($('#a_year').value)||new Date().getFullYear();
  a.status=$('#a_status').value; a.cover=$('#a_cover').value.trim(); a.description=$('#a_desc').value;
  a.id = a.id || slugify(a.name);
  try{ setStatus('Saving album…','work'); const arr=state.data.albums; const i=arr.findIndex(x=>x.id===a.id); if(i>=0) arr[i]=a; else arr.push(a); await saveDataBlock('SITE_ALBUMS', arr, `album: ${a.name}`); setStatus('Album saved','ok'); renderList(); }catch(e){ setStatus('Save failed','err'); alert(e.message) }
}
async function deleteAlbum(){ const a=getCurrentItem(); if(!a||!confirm('Delete album?')) return; try{ setStatus('Deleting…','work'); state.data.albums=state.data.albums.filter(x=>x.id!==a.id); await saveDataBlock('SITE_ALBUMS', state.data.albums, `delete album: ${a.name}`); state.currentId=null; setStatus('Deleted','ok'); render(); }catch(e){ setStatus('Delete failed','err'); } }

// ── Video compression using MediaRecorder + Canvas ──────────────────────────
// Quality presets: cap resolution + set bitrate. Browser transcodes client-side.
async function compressVideo(file, quality){
  const presets = {
    high:   { maxH: 1080, videoBps: 4_000_000, audioBps: 128_000 },
    medium: { maxH: 720,  videoBps: 1_500_000, audioBps:  96_000 },
    low:    { maxH: 480,  videoBps:   600_000, audioBps:  64_000 },
  };
  const p = presets[quality] || presets.medium;

  // Load video into a hidden element
  const vid = document.createElement('video');
  vid.muted = true;
  vid.src = URL.createObjectURL(file);
  await new Promise((res,rej)=>{ vid.onloadedmetadata=res; vid.onerror=rej; });

  // Compute scaled dimensions
  const scale = Math.min(1, p.maxH / vid.videoHeight);
  const w = Math.round(vid.videoWidth  * scale / 2) * 2; // must be even
  const h = Math.round(vid.videoHeight * scale / 2) * 2;

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Pick best supported codec
  const mimeTypes = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  const mimeType = mimeTypes.find(m=>MediaRecorder.isTypeSupported(m)) || 'video/webm';

  const stream = canvas.captureStream(30);
  // Add audio if source has it
  try {
    const audioCtx = new AudioContext();
    const src = audioCtx.createMediaElementSource(vid);
    const dest = audioCtx.createMediaStreamDestination();
    src.connect(dest);
    dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  } catch(e){ /* no audio track, fine */ }

  const recorder = new MediaRecorder(stream, {
    mimeType,
    videoBitsPerSecond: p.videoBps,
    audioBitsPerSecond: p.audioBps,
  });
  const chunks = [];
  recorder.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };

  // Play + draw frames
  recorder.start(100);
  vid.play();
  await new Promise(res=>{
    vid.ontimeupdate = ()=>ctx.drawImage(vid, 0, 0, w, h);
    vid.onended = ()=>{ recorder.stop(); res(); };
  });
  await new Promise(res=>{ recorder.onstop=res; });

  URL.revokeObjectURL(vid.src);
  const blob = new Blob(chunks, { type: mimeType });
  const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
  return new File([blob], file.name.replace(/\.[^.]+$/, '')+`_${quality}.${ext}`, { type: mimeType });
}

function esc(s){ return (s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])) }
function showImg(src){ $('#modalImg').src=src; $('#modal').classList.add('show') }

$('#tabs').onclick=e=>{
  const btn=e.target.closest('.tab'); if(!btn) return;
  state.tab=btn.dataset.tab; state.currentId=null; render();
};
$('#btnNew').onclick=()=>{
  const arr=getCurrentArray();
  if(state.tab==='blog'){ const id='post-'+Date.now(); arr.unshift({id,title:'New Post',category:(state.data.categories[0]?.name||'Daily Life'),subcategory:'',date:today(),color:'#A596DA',blocks:[{type:'text',content:''}]}); state.currentId=id; }
  else if(state.tab==='songs'){ const id='song-'+Date.now(); arr.unshift({id,title:'New Song',artist:'DennisZeroVT',year:new Date().getFullYear(),status:'Pending',genres:[],coverEmoji:'🎵',badges:[],streaming:{},blocks:[],credits:[],about:'',thoughts:'',miscellaneous:'',behindTheScenes:''}); state.currentId=id; }
  else if(state.tab==='people'){ const id='person-'+Date.now(); arr.unshift({id,name:'New Person',handle:'',role:'',avatar:'',bio:'',tags:['friend'],links:{},projects:[],color:'text-purple-400',icon:'👤',showOnHome:true}); state.currentId=id; }
  else if(state.tab==='categories'){ const id='cat-'+Date.now(); arr.unshift({id,name:'New Category',color:'#A596DA',subs:[]}); state.currentId=id; }
  else { const id='album-'+Date.now(); arr.unshift({id,name:'New Album',artist:'DennisZeroVT',year:new Date().getFullYear(),cover:'',status:'In Progress',description:'',tracklist:[]}); state.currentId=id; }
  render();
};
$('#btnConnect').onclick=()=>{ state.token=$('#token').value.trim(); connect(); };

(function init(){
  $('#token').value = state.token;
  setStatus('Ready — enter token to connect');
  // load fallbacks for UI preview
  state.data.posts = migratePosts(FALLBACK_POSTS);
  state.data.songs = FALLBACK_SONGS;
  state.data.people = FALLBACK_PEOPLE;
  state.data.albums = FALLBACK_ALBUMS;
  state.data.categories = FALLBACK_CATEGORIES;
  renderList();
})();
