name: Bake JSON
on:
  push:
    paths: ['data/**.json','build.js']
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node build.js
      - run: |
          git config user.name "dzvt"
          git config user.email "bot@denniszerovt"
          git add *.html
          git diff --quiet || git commit -m "rebuild" && git push
