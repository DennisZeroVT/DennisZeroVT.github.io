name: Bake JSON
on:
  push:
    paths:
            - 'data/**/*.json'
            - 'build.js'
            - '**/*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
            - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
            - run: node build.js
        
            - name: Commit baked HTML
        run: |
          git config user.name "dzvt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html blog.html music.html friends.html collabs.html rhythm.html || true
          git diff --cached --quiet || git commit -m "chore: bake JSON into HTML"
          git push
